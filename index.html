<style>
:root{
  --bg:#0a0604;--card:#f4e4c1;--card2:#e8d5a3;--ink:#3a2a14;
  --warm:#8b5e34;--gold:#c9952b;--danger:#a03020;--ok:#4a7a3a;
  --blue:#3a6a9a;--light:#f0deb8;--border:#2a1a0a;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:linear-gradient(180deg,#1a1408,var(--bg));color:var(--ink);
  font-family:'Palatino Linotype','Book Antiqua',Georgia,serif;
  display:flex;justify-content:center;padding:8px;min-height:100vh;}
#app{background:linear-gradient(145deg,var(--card),var(--card2),var(--light),#e2c990);
  border-radius:6px;box-shadow:0 4px 24px rgba(0,0,0,.5);max-width:560px;width:100%;
  overflow:hidden;display:flex;flex-direction:column;max-height:100vh;}
.hdr{background:linear-gradient(135deg,#5a3a1a,#3a2510);color:var(--light);
  padding:10px 14px;display:flex;justify-content:space-between;align-items:center;flex-shrink:0;}
.hdr h1{font-size:14px;font-weight:700;margin:0;}
.hdr small{font-size:10px;opacity:.7;}
.sec{padding:10px 14px;border-bottom:1px solid rgba(42,26,10,.13);}
.sec-title{font-size:10px;text-transform:uppercase;letter-spacing:1.5px;color:var(--warm);font-weight:700;margin-bottom:5px;}
.btn{padding:6px 12px;border-radius:4px;border:1px solid var(--warm);
  background:linear-gradient(180deg,var(--card),#dcc690);color:var(--ink);
  cursor:pointer;font-family:inherit;font-size:12px;font-weight:600;}
.btn:hover{filter:brightness(1.05);}
.btn-p{background:linear-gradient(180deg,var(--warm),#6b4520);color:var(--light);border-color:#4a3015;}
.btn-s{padding:3px 8px;font-size:11px;}
.btn-active{background:var(--warm)!important;color:var(--light)!important;border-color:transparent!important;}
.btn-danger{background:linear-gradient(180deg,#a03020,#701a10);color:var(--light);border-color:#4a1a0a;}
.pill{display:inline-flex;align-items:center;gap:2px;padding:1px 5px;border-radius:10px;
  font-size:10px;font-weight:700;background:rgba(139,94,52,.1);border:1px solid rgba(139,94,52,.15);}
.pill.warn{background:rgba(160,48,32,.15);color:var(--danger);border-color:rgba(160,48,32,.2);}
.pill.ok{background:rgba(74,122,58,.15);color:var(--ok);border-color:rgba(74,122,58,.2);}
/* Klíčové metriky — vizuálně větší */
.pill.key{padding:2px 7px;font-size:11px;background:rgba(139,94,52,.15);border-color:rgba(139,94,52,.25);}
/* Ember glow — kritické metriky */
@keyframes emberPulse{
  0%,100%{box-shadow:0 0 4px 1px rgba(200,80,20,.55),0 0 0 0 rgba(200,80,20,.0);background:rgba(180,50,10,.22);}
  50%{box-shadow:0 0 8px 3px rgba(220,100,30,.75),0 0 0 3px rgba(220,100,30,.12);background:rgba(200,70,15,.32);}
}
.pill.ember{animation:emberPulse 1.6s ease-in-out infinite;color:#e84020;border-color:rgba(200,60,10,.4);font-weight:700;}
/* Attention banner */
.attention-banner{background:linear-gradient(90deg,rgba(160,48,32,.12),rgba(200,80,20,.08));
  border:1px solid rgba(180,60,20,.3);border-radius:5px;padding:6px 10px;margin-bottom:8px;}
.attention-banner .att-title{font-size:10px;font-weight:700;color:#a03020;margin-bottom:4px;letter-spacing:.03em;}
.attention-item{display:flex;align-items:flex-start;gap:5px;font-size:10px;color:#5a2a10;
  margin-bottom:3px;line-height:1.5;}
.attention-item.critical{color:#a03020;font-weight:600;}
.attention-item .att-action{color:#8b5e34;font-style:italic;margin-left:3px;}
/* Retention modal */
.retention-modal-box{background:linear-gradient(145deg,#f5e9c8,#ead8a5);border-radius:7px;
  padding:18px 20px;max-width:360px;width:92%;box-shadow:0 6px 32px rgba(0,0,0,.5);
  border:2px solid #8b5e34;font-family:Georgia,serif;}
.contract-btn{display:flex;justify-content:space-between;align-items:center;
  padding:5px 10px;border-radius:4px;border:1px solid rgba(42,26,10,.2);
  background:rgba(255,255,255,.35);cursor:pointer;font-size:11px;margin-bottom:3px;
  transition:background .15s;}
.contract-btn:hover{background:rgba(139,94,52,.15);}
.contract-btn.selected{background:rgba(139,94,52,.25);border-color:#8b5e34;font-weight:700;}
.bar-track{width:100%;height:8px;background:rgba(0,0,0,.12);border-radius:4px;overflow:hidden;}
.bar-fill{height:100%;border-radius:4px;transition:width .3s;}
.tabs{display:flex;gap:1px;padding:0 6px;border-bottom:1px solid rgba(42,26,10,.13);
  background:rgba(0,0,0,.02);flex-shrink:0;overflow:hidden;}
.tab{padding:6px 7px;font-size:13px;font-weight:500;color:var(--warm);background:none;
  border:none;border-radius:4px 4px 0 0;cursor:pointer;font-family:inherit;white-space:nowrap;
  display:flex;align-items:center;gap:3px;flex-shrink:0;}
.tab .tab-label{font-size:11px;font-weight:700;max-width:0;overflow:hidden;opacity:0;
  transition:max-width .2s ease,opacity .15s ease;white-space:nowrap;}
.tab.active{color:var(--light);background:var(--warm);}
.tab.active .tab-label{max-width:80px;opacity:1;}
.content{flex:1;overflow-y:auto;min-height:0;}
/* Mobil: content-shell drží content + button dole */
.mobile-shell{display:flex;flex-direction:column;flex:1;overflow:hidden;min-height:0;}
.mobile-shell .content{flex:1;overflow-y:auto;min-height:0;}
.mobile-shell .action-bar{flex-shrink:0;}
.action-bar{padding:10px 14px;border-top:2px solid rgba(42,26,10,.2);flex-shrink:0;
  background:linear-gradient(135deg,var(--card),var(--card2));
  padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));
  position:sticky;bottom:0;z-index:10;}
.round-bar{display:flex;flex-direction:column;padding:4px 14px;
  background:rgba(0,0,0,.03);border-bottom:1px solid rgba(42,26,10,.13);flex-shrink:0;}
.round-bar-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:3px;font-size:11px;}
.round-pip{width:22px;height:20px;border-radius:3px;display:flex;align-items:center;
  justify-content:center;font-size:8px;flex-shrink:0;}
.res-bar{display:flex;flex-direction:column;gap:2px;padding:5px 14px;
  border-bottom:1px solid rgba(42,26,10,.13);flex-shrink:0;}
.pill-row{display:flex;flex-wrap:nowrap;gap:3px;align-items:center;}
.pill-sep{color:rgba(42,26,10,.25);font-size:11px;padding:0 2px;flex-shrink:0;}
.pill-primary .pill{padding:2px 7px;font-size:11px;}
#app.desktop .res-bar{flex-direction:row;align-items:center;flex-wrap:nowrap;}
#app.desktop .pill-row{flex-wrap:nowrap;}
#app.desktop .pill-row+.pill-row{margin-left:0;}
.worker-card{margin-bottom:8px;padding:6px;background:rgba(0,0,0,.02);border-radius:4px;}
.worker-name{font-size:12px;font-weight:700;margin-bottom:3px;}
.task-btns{display:flex;flex-wrap:wrap;gap:2px;}
.alloc-row{display:flex;align-items:center;gap:6px;margin-bottom:4px;font-size:12px;}
.alloc-row span:first-child{width:100px;}
.alloc-row input[type=range]{flex:1;height:4px;accent-color:var(--warm);}
.alloc-row strong{width:30px;text-align:right;}
.log-box{max-height:280px;overflow:auto;font-size:11px;line-height:1.5;
  font-family:'Courier New',monospace;padding:6px;background:rgba(0,0,0,.03);border-radius:4px;}
/* ── ARCHIV TAB ── */
.ach-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:10px;margin-bottom:14px;}
.ach-card{display:flex;flex-direction:column;align-items:center;gap:5px;padding:8px 4px;
  border-radius:8px;border:1px solid rgba(42,26,10,.15);cursor:default;transition:transform .15s;}
.ach-card.unlocked{border-color:rgba(201,149,43,.35);background:rgba(42,26,10,.25);}
.ach-card.locked{opacity:.55;filter:grayscale(.6);}
.ach-card.future{opacity:.3;filter:grayscale(1);}
.ach-card:hover.unlocked{transform:scale(1.04);}
.ach-title{font-size:10px;font-weight:700;text-align:center;color:var(--warm);line-height:1.3;max-width:80px;}
.ach-card.locked .ach-title{color:#6a4830;}
.wiki-grid{display:flex;flex-direction:column;gap:6px;}
.wiki-card{padding:9px 11px;border-radius:7px;border:1px solid rgba(42,26,10,.15);
  background:rgba(42,26,10,.12);}
.wiki-card-hdr{display:flex;align-items:center;gap:6px;margin-bottom:4px;cursor:pointer;}
.wiki-card-icon{font-size:16px;}
.wiki-card-title{font-size:12px;font-weight:700;color:var(--warm);}
.wiki-card-src{font-size:9px;color:#8b6a3a;font-style:italic;margin-top:2px;}
.wiki-card-body{font-size:11px;color:#5a3a18;line-height:1.6;}
.wiki-card-latin{font-size:10px;font-style:italic;color:#9a7040;margin-top:4px;}
.ach-cat-hdr{font-size:11px;font-weight:700;color:#8b5e34;letter-spacing:.6px;
  text-transform:uppercase;margin:10px 0 6px;padding-bottom:3px;
  border-bottom:1px solid rgba(139,94,52,.2);}
/* ── PARTA TAB ── */
.parta-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:10px 12px;}
#app.desktop .parta-grid{grid-template-columns:repeat(5,1fr);gap:10px;padding:12px 16px;}
#app.desktop .parta-portrait{aspect-ratio:3/4;max-height:180px;}
#app.desktop .parta-name{font-size:12px;}
#app.desktop .parta-prof{font-size:10px;}
#app.desktop .parta-stars{font-size:12px;}
.parta-card{background:var(--card);border-radius:6px;overflow:hidden;cursor:pointer;
  border:2px solid transparent;transition:border-color .15s,transform .1s;position:relative;}
.parta-card:hover{transform:translateY(-2px);}
.parta-card.mood-ok{border-color:rgba(74,122,58,.4);}
.parta-card.mood-warn{border-color:rgba(200,150,40,.5);}
.parta-card.mood-bad{border-color:rgba(160,48,32,.5);}
.parta-portrait{width:100%;aspect-ratio:1;overflow:hidden;background:#1a0e06;position:relative;}
.parta-portrait img{width:100%;height:100%;object-fit:cover;object-position:top center;display:block;}
.parta-portrait-svg{width:100%;height:100%;display:flex;align-items:center;justify-content:center;}
.parta-debt-badge{position:absolute;top:4px;right:4px;background:rgba(160,48,32,.9);
  color:#fff;font-size:9px;font-weight:700;padding:2px 4px;border-radius:3px;line-height:1.2;}
.parta-info{padding:5px 6px 6px;}
.parta-name{font-size:11px;font-weight:700;color:#3a2010;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.parta-prof{font-size:9px;color:var(--warm);margin-bottom:3px;}
.parta-stars{font-size:10px;letter-spacing:-1px;}
.parta-bar-row{display:flex;align-items:center;gap:3px;margin-top:2px;}
.parta-bar-lbl{font-size:8px;color:var(--warm);width:22px;flex-shrink:0;}
.parta-bar{flex:1;height:3px;background:rgba(0,0,0,.2);border-radius:2px;overflow:hidden;}
.parta-bar-fill{height:100%;border-radius:2px;transition:width .3s;}
/* Parta summary header */
.parta-summary{display:flex;gap:8px;padding:8px 12px 0;flex-wrap:wrap;}
.parta-sum-pill{background:var(--card);border-radius:4px;padding:4px 8px;font-size:11px;
  display:flex;align-items:center;gap:4px;}
/* Detail modal — subtabs */
.detail-subtabs{display:flex;gap:2px;margin-bottom:10px;border-bottom:1px solid rgba(42,26,10,.15);padding-bottom:6px;}
.detail-subtab{padding:4px 8px;font-size:11px;font-weight:600;border-radius:4px 4px 0 0;
  border:none;background:none;cursor:pointer;color:var(--warm);}
.detail-subtab.active{background:var(--warm);color:var(--light);}
.detail-portrait-big{width:96px;height:96px;border-radius:6px;overflow:hidden;
  flex-shrink:0;background:#1a0e06;border:2px solid var(--warm);}
.detail-portrait-big img{width:100%;height:100%;object-fit:cover;object-position:top center;}
.trait-badge{display:inline-flex;align-items:center;gap:3px;padding:2px 6px;
  background:rgba(42,26,10,.12);border-radius:10px;font-size:10px;margin:2px;}
.xp-track{display:flex;gap:3px;margin-top:4px;}
.xp-pip{width:14px;height:8px;border-radius:2px;background:rgba(0,0,0,.15);}
.xp-pip.filled{background:var(--warm);}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;
  align-items:center;justify-content:center;z-index:100;padding:16px;}
.modal{background:linear-gradient(145deg,var(--card),var(--card2));border-radius:6px;
  max-width:440px;width:100%;padding:18px;max-height:80vh;overflow:auto;
  box-shadow:0 4px 24px rgba(0,0,0,.5);}
.shop-grid{display:grid;grid-template-columns:1fr 1fr;gap:3px;}
.stars{letter-spacing:-1px;font-size:12px;}
.hint-box{padding:6px 8px;background:rgba(0,0,0,.03);border-radius:4px;font-size:12px;
  line-height:1.5;margin-bottom:8px;}
.temp-bar{display:flex;gap:2px;margin-bottom:4px;}
.temp-seg{flex:1;height:12px;border-radius:2px;transition:all .3s;}
.furnace-card{background:rgba(0,0,0,.03);border-radius:4px;padding:8px;margin-bottom:6px;}
.furnace-stat{display:flex;justify-content:space-between;font-size:11px;margin-bottom:3px;}
.interseason-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px;}
.interseason-card{padding:8px;background:rgba(0,0,0,.04);border-radius:4px;font-size:12px;}
.season-badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:10px;font-weight:700;}
.eff-bar{height:6px;border-radius:3px;background:rgba(0,0,0,.1);overflow:hidden;margin-top:3px;}
.eff-fill{height:100%;border-radius:3px;transition:width .4s;}
.fat-bar{height:4px;border-radius:2px;background:rgba(0,0,0,.08);overflow:hidden;margin-top:2px;}
.fat-fill{height:100%;border-radius:2px;transition:width .3s;}
.settings-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid rgba(42,26,10,.08);}
.settings-row:last-child{border-bottom:none;}
.settings-label{font-size:12px;color:var(--ink);flex:1;}
.settings-val{font-size:11px;color:var(--warm);width:36px;text-align:right;}
/* Tooltip */
.tip-wrap{position:relative;display:inline-flex;}
.tip-wrap .tip{display:none;position:absolute;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%);
  background:#2a1608;color:#f0deb8;font-size:11px;padding:5px 9px;border-radius:4px;
  white-space:nowrap;z-index:50;border:1px solid #8b5e34;pointer-events:none;line-height:1.4;
  font-family:'Palatino Linotype',Georgia,serif;}
.tip-wrap:hover .tip,.tip-wrap.open .tip{display:block;}
/* Sezónní kontext panel */
.season-panel{padding:8px 14px;border-bottom:1px solid rgba(42,26,10,.15);flex-shrink:0;
  background:linear-gradient(135deg,rgba(139,94,52,.08),rgba(201,149,43,.05));}
.season-panel-top{display:flex;align-items:center;gap:8px;margin-bottom:4px;}
.season-icon{font-size:20px;flex-shrink:0;}
.season-phase{font-size:11px;font-weight:700;color:var(--warm);text-transform:uppercase;letter-spacing:.8px;}
.season-priority{font-size:12px;color:var(--ink);line-height:1.4;font-style:italic;}
.season-tip{font-size:11px;color:#6a4a28;margin-top:2px;line-height:1.4;}
.season-trh{font-size:10px;margin-top:3px;font-weight:700;}
/* Pec dashboard */
.furnace-dash{background:#1a0e06;border-radius:6px;padding:12px;margin-bottom:8px;color:#f0deb8;}
.furnace-temp-gauge{display:flex;align-items:flex-end;gap:3px;height:60px;margin-bottom:8px;}
.gauge-bar{flex:1;border-radius:2px 2px 0 0;transition:height .5s,background .5s;}
.furnace-readout{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:8px;}
.furn-stat{background:rgba(255,255,255,.05);border-radius:4px;padding:6px 8px;}
.furn-stat-label{font-size:9px;color:#8b5e34;letter-spacing:1px;text-transform:uppercase;margin-bottom:2px;}
.furn-stat-val{font-size:16px;font-weight:700;}
.shamot-visual{display:flex;gap:2px;margin-top:4px;}
.shamot-brick{flex:1;height:10px;border-radius:2px;transition:background .4s;}
/* ── MELT / SKLOVINA ANIMATION ── */
.fire-stage{display:none;} /* legacy — not used */
@keyframes meltRot1{from{transform:rotate(0deg);}to{transform:rotate(360deg);}}
@keyframes meltRot2{from{transform:rotate(0deg);}to{transform:rotate(-360deg);}}
@keyframes meltPulse{0%,100%{opacity:.55;}50%{opacity:1;}}
@keyframes bubbleRise{
  0%{transform:translateY(0) scale(1);opacity:.4;}
  70%{opacity:.3;}
  100%{transform:translateY(-38px) scale(1.6);opacity:0;}}
.furnace-hud{display:flex;align-items:center;gap:6px;padding:4px 14px;
  border-bottom:1px solid rgba(42,26,10,.13);flex-shrink:0;background:rgba(0,0,0,.02);flex-wrap:wrap;overflow:hidden;}
.furnace-temp-big{font-size:22px;line-height:1;flex-shrink:0;}
.furnace-details{flex:1;min-width:0;}
.furnace-hud-row{display:flex;align-items:center;gap:4px;font-size:10px;color:#8b5e34;}
.toast-container{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);
  width:calc(100% - 32px);max-width:520px;z-index:200;pointer-events:none;}
.toast{background:linear-gradient(145deg,#3a2510,#2a1a08);color:var(--light);
  border-radius:6px;padding:10px 14px;font-size:12px;line-height:1.5;
  border-left:3px solid var(--gold);margin-top:6px;
  animation:toastIn .25s ease;font-family:'Palatino Linotype','Book Antiqua',Georgia,serif;}
.toast-title{font-weight:700;font-size:11px;color:var(--gold);margin-bottom:3px;
  text-transform:uppercase;letter-spacing:.8px;}
@keyframes toastIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.log-entry{padding:6px 0;border-bottom:1px solid rgba(42,26,10,.07);font-size:12px;line-height:1.6;}
.log-entry:last-child{border-bottom:none;}
.log-season-hdr{font-size:13px;font-weight:700;color:var(--warm);margin:10px 0 4px;
  padding-bottom:4px;border-bottom:2px solid rgba(139,94,52,.2);}
@media(max-width:600px){body{padding:4px;}.hdr h1{font-size:12px;}}

/* ── DESKTOP LAYOUT — JS přidá .desktop na #app při ≥768px ── */
#app.desktop{max-width:1140px;max-height:calc(100vh - 16px);}
/* Taby — levý sidebar */
#app.desktop .tabs{
  flex-direction:column;width:140px;flex-shrink:0;
  border-bottom:none;border-right:1px solid rgba(42,26,10,.15);
  background:linear-gradient(180deg,rgba(0,0,0,.04),rgba(0,0,0,.02));
  overflow-x:visible;overflow-y:auto;padding:8px 0;gap:2px;}
#app.desktop .tab{
  border-radius:4px 0 0 4px;text-align:left;
  padding:9px 14px;font-size:12px;white-space:normal;
  border-right:3px solid transparent;}
#app.desktop .tab .tab-label{max-width:100px!important;opacity:1!important;}
#app.desktop .tab.active{
  border-radius:4px 0 0 4px;
  border-right:3px solid var(--gold);
  background:rgba(201,149,43,.12);color:var(--warm);}
/* Shell: tabs vlevo + content vpravo */
#app.desktop .desktop-shell{display:flex;flex:1;overflow:hidden;min-height:0;}
#app.desktop .content-shell{display:flex;flex-direction:column;flex:1;overflow:hidden;min-height:0;}
#app.desktop .content{flex:1;overflow-y:auto;}
#app.desktop .action-bar{flex-shrink:0;}
/* Toast vpravo dole */
#app.desktop ~ #toastContainer,
.toast-container{left:auto;right:20px;transform:none;max-width:360px;}
/* Overview: sezóna + pec vedle sebe */
#app.desktop .overview-top-cols{display:grid;grid-template-columns:1fr 1fr;gap:0;
  border-bottom:1px solid rgba(42,26,10,.13);}
#app.desktop .overview-top-cols>.sec{border-bottom:none;border-right:1px solid rgba(42,26,10,.1);}
#app.desktop .overview-top-cols>.sec:last-child{border-right:none;}
/* Dělníci: 2 sloupce */
#app.desktop .workers-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:0 14px 10px;}
#app.desktop .workers-grid .worker-card{margin-bottom:0;}
/* Výroba: auto + custom ve 2 sloupcích */
#app.desktop .production-cols{display:grid;grid-template-columns:1fr 1fr;gap:0;}
#app.desktop .production-cols>.sec{border-bottom:none;border-right:1px solid rgba(42,26,10,.1);}
#app.desktop .production-cols>.sec:last-child{border-right:none;}
/* Pec tab: 3/1 split (dash / účinnost) */
#app.desktop .furnace-cols{display:grid;grid-template-columns:3fr 1fr;gap:0;border-bottom:1px solid rgba(42,26,10,.13);}
#app.desktop .furnace-cols>.sec{border-bottom:none;border-right:1px solid rgba(42,26,10,.1);}
#app.desktop .furnace-cols>.sec:last-child{border-right:none;}
/* Production tab: CSS columns na desktopu */
#app.desktop .content.prod-desktop{column-count:2;column-gap:0;column-rule:1px solid rgba(42,26,10,.1);}
#app.desktop .content.prod-desktop>.sec{break-inside:avoid;}

/* ── Task pill animation ── */
@keyframes pillFly{
  0%{opacity:1;transform:translateY(0) scale(1);}
  60%{opacity:1;transform:translateY(-38px) scale(1.1);}
  100%{opacity:0;transform:translateY(-70px) scale(.9);}
}
.task-pill{
  position:fixed;pointer-events:none;z-index:9999;
  padding:2px 8px;border-radius:10px;font-size:11px;font-weight:700;
  background:rgba(42,26,10,.85);color:#f4e4c1;white-space:nowrap;
  animation:pillFly .9s ease-out forwards;
}
.task-pill.pos{background:rgba(74,122,58,.9);}
.task-pill.neg{background:rgba(160,48,32,.9);}

/* ════════════════════════════════════════════════════════════
   FAJRUM FLUID ANIMATIONS & GRAPHICAL IMPROVEMENTS
════════════════════════════════════════════════════════════ */
@keyframes tabFadeSlide {
  0% { opacity: 0; transform: translateY(6px); }
  100% { opacity: 1; transform: translateY(0); }
}
.tab-enter {
  animation: tabFadeSlide 0.22s cubic-bezier(0.16, 1, 0.3, 1) forwards;
}

/* Micro-physics for buttons & tactile feedback */
.btn {
  transition: transform 0.1s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.15s ease, box-shadow 0.15s ease !important;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
}
.btn:active {
  transform: scale(0.95) translateY(1px) !important;
  filter: brightness(0.92) !important;
}
.btn:focus-visible {
  outline: 2px solid var(--gold);
  outline-offset: 1px;
}

/* Stepper buttons for responsive allocations */
.stepper-btn {
  padding: 2px 7px !important;
  font-size: 10px !important;
  font-weight: 700 !important;
  border-radius: 3px !important;
  background: rgba(139, 94, 52, 0.14) !important;
  border: 1px solid rgba(139, 94, 52, 0.35) !important;
  color: var(--ink) !important;
  cursor: pointer;
  line-height: 1.2;
}
.stepper-btn:hover {
  background: rgba(139, 94, 52, 0.28) !important;
  border-color: var(--warm) !important;
}

/* Batch craft buttons */
.batch-btn-row {
  display: flex;
  gap: 3px;
  width: 100%;
}
.batch-btn {
  flex: 1;
  padding: 3px 4px !important;
  font-size: 9px !important;
  font-weight: 700 !important;
  border-radius: 3px !important;
  line-height: 1.2;
}

/* Hotkey hint badges */
.hotkey-badge {
  display: inline-block;
  font-size: 9px;
  font-family: monospace;
  font-weight: 700;
  padding: 0 4px;
  border-radius: 3px;
  background: rgba(42, 26, 10, 0.15);
  border: 1px solid rgba(42, 26, 10, 0.3);
  color: #6a4520;
  margin-left: 4px;
  vertical-align: middle;
}

/* Smooth custom scrollbars */
::-webkit-scrollbar {
  width: 6px;
  height: 6px;
}
::-webkit-scrollbar-track {
  background: rgba(42, 26, 10, 0.06);
  border-radius: 3px;
}
::-webkit-scrollbar-thumb {
  background: rgba(139, 94, 52, 0.35);
  border-radius: 3px;
  border: 1px solid rgba(42, 26, 10, 0.1);
}
::-webkit-scrollbar-thumb:hover {
  background: rgba(139, 94, 52, 0.6);
}

/* Glassware sheen highlight */
@keyframes glassShine {
  0% { transform: translateX(-100%) rotate(25deg); }
  100% { transform: translateX(200%) rotate(25deg); }
}
.glass-shine-wrap {
  position: relative;
  overflow: hidden;
}
.glass-shine-wrap:hover::after {
  content: '';
  position: absolute;
  top: -50%;
  left: -50%;
  width: 200%;
  height: 200%;
  background: linear-gradient(60deg, transparent 40%, rgba(255, 255, 255, 0.25) 50%, transparent 60%);
  animation: glassShine 0.75s ease-out forwards;
  pointer-events: none;
}

/* Floating resource pill animation */
@keyframes floatPillAnim {
  0% {
    opacity: 0;
    transform: translateY(8px) scale(0.85);
  }
  20% {
    opacity: 1;
    transform: translateY(-4px) scale(1.08);
  }
  60% {
    opacity: 1;
    transform: translateY(-28px) scale(1);
  }
  100% {
    opacity: 0;
    transform: translateY(-56px) scale(0.9);
  }
}
.float-pill {
  position: fixed;
  pointer-events: none;
  z-index: 10000;
  padding: 3px 9px;
  border-radius: 12px;
  font-size: 12px;
  font-weight: 700;
  white-space: nowrap;
  box-shadow: 0 4px 14px rgba(0, 0, 0, 0.3);
  animation: floatPillAnim 0.95s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
  font-family: 'Palatino Linotype', Georgia, serif;
}
.float-pill.pos {
  background: linear-gradient(135deg, #38761d, #274e13);
  color: #f7edd4;
  border: 1px solid #6aa84f;
  text-shadow: 0 1px 2px rgba(0, 0, 0, 0.5);
}
.float-pill.neg {
  background: linear-gradient(135deg, #a03020, #661810);
  color: #fff;
  border: 1px solid #e06666;
  text-shadow: 0 1px 2px rgba(0, 0, 0, 0.5);
}
.float-pill.gold {
  background: linear-gradient(135deg, #c9952b, #8a6212);
  color: #fffef0;
  border: 1px solid #ffd966;
  text-shadow: 0 1px 2px rgba(0, 0, 0, 0.5);
}
.float-pill.fire {
  background: linear-gradient(135deg, #e65100, #b71c1c);
  color: #fff8e1;
  border: 1px solid #ff9800;
  text-shadow: 0 1px 2px rgba(0, 0, 0, 0.5);
}

/* Heat shimmer overlay for furnace */
@keyframes heatDistort {
  0%, 100% { transform: scaleY(1) skewX(0deg); opacity: 0.25; }
  50% { transform: scaleY(1.04) skewX(1deg); opacity: 0.45; }
}
.heat-shimmer-box {
  position: relative;
}
.heat-shimmer-box::before {
  content: '';
  position: absolute;
  inset: -2px;
  border-radius: inherit;
  background: radial-gradient(circle at 50% 100%, rgba(255, 120, 20, 0.18), transparent 70%);
  animation: heatDistort 2.4s ease-in-out infinite;
  pointer-events: none;
  z-index: 1;
}

/* Polished Tab animations */
.tab {
  position: relative;
  transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1) !important;
}
.tab:active {
  transform: scale(0.96);
}
.tab.active::after {
  content: '';
  position: absolute;
  bottom: 0;
  left: 20%;
  right: 20%;
  height: 2px;
  background: var(--gold);
  border-radius: 1px;
}

   GLASS CHEMICAL SUBSTANCE ANIMATED LOGO & HEADER NETWORK

@keyframes chemPulse {
  0%, 100% { transform: scale(1); filter: drop-shadow(0 0 2px rgba(201,149,43,0.3)); }

}

  100% { transform: translateX(120%) rotate(35deg); opacity: 0; }

}

@keyframes formulaBadgePulse {

.glass-chemical-logo {

.chem-badge-pill {
  display: inline-flex;
  align-items: center;
  gap: 3px;
  font-family: 'Palatino Linotype', Georgia, serif;
  font-size: 7.5px;
  font-weight: 700;
  letter-spacing: 0.6px;
  padding: 1px 6px;

  animation: formulaBadgePulse 4s infinite ease-in-out;

.chem-badge-pill:hover {
  border-color: #ffd54f;

  transform: translateY(-1px);
}

.chem-network-wrap {

.chem-network-wrap:hover {
  opacity: 1 !important;
  transform: scale(1.04);

}

const IDLE_WAGE_FACTOR=0.5;
function baseWageRateFor(isP,isEasy){return isP?(isEasy?1:1.5):(isEasy?1.5:2);}
function workerWageFor(w,rate,task){
  const work=Math.max(1,Math.round(rate+(w.wageMod||0)));
  return (task||w.task)==="idle"?Math.max(1,Math.ceil(work*IDLE_WAGE_FACTOR)):work;
}

function isPrepMonth(round, tier=0){
  if(tier>=3) return false;
  if(tier===2) return round>=1 && round<=3; // Prosinec, Leden, Únor
  if(tier===1) return round>=1 && round<=4; // Prosinec, Leden, Únor, Březen
  return round>=0 && round<=4; // Listopad..Březen
}
function isCampaignMonth(round, tier=0){
  return !isPrepMonth(round, tier);
}
function isTemperingMonth(round, tier=0){
  if(tier>=3) return false;
  if(tier===2) return round===3; // Únor temperování
  return round===4; // Březen temperování
}
function getLightingMonth(tier=0){
  if(tier>=3) return null;
  if(tier===2) return 4; // Březen rozžehnutí
  return 5; // Duben rozžehnutí
}

// Nákup parcel lesa — max 60, cena roste s počtem
function buyParcely(n){
  const cur=G.forest;
  const max=200;
  if(cur>=max){G.log.push(`__EVT__🌲 ${G.lang==="cs"?"Hvozd je na maximu (200 parcel)":"Forest at maximum (200 parcels)"}`);render();return;}
  const buy=Math.min(n,max-cur);
  const price=buy*8; // 8g/parcela
  if(G.grose<price){G.log.push(`__EVT__❌ ${G.lang==="cs"?"Nedostatek grošů":"Not enough groats"}`);render();return;}
  G.grose-=price;
  G.forest+=buy;
  G.forestMax=(G.forestMax||INIT_FOREST)+buy; // koupené parcely navyšují strop
  G.log.push(`__ECO__🌲 ${G.lang==="cs"?"Zakoupeno":"Bought"} ${buy} ${G.lang==="cs"?"parcel lesa":"forest parcels"} (-${price}g)`);
  render();
}

// Tomislavův rank — globálně dostupná funkce, stejná logika jako v UI Deníku
function getTomislavRank(p){
  const mins=[
    {id:"pomocnik", s:0, g:0},
    {id:"ucen",     s:1, g:50},
    {id:"tovarys",  s:2, g:200},
    {id:"mistr",    s:4, g:600},
    {id:"velmistr", s:8, g:2000},
  ];
  let idx=0;
  mins.forEach((m,i)=>{if((p.season||1)>=m.s&&(p.grose||0)>=m.g)idx=i;});
  return mins[idx].id;
}

// Kteří NPC jsou k dispozici pro nábor (ještě ne v huti)
function getAvailableNPC(){
  const inHutte=(G?.workers||[]).map(w=>w.npcId).filter(Boolean);
  return NPC_ROSTER.filter(n=>!inHutte.includes(n.id));
}

function genCandidates(season, count){
  const available=getAvailableNPC().filter(n=>{
    const minSeason=n.availSeason!==undefined?n.availSeason:1;
    return season>=minSeason;
  });
  if(available.length===0)return [];
  // Zamíchej a vyber unikátní kandidáty (žádné duplikáty)
  const shuffled=[...available].sort(()=>Math.random()-.5);
  return shuffled.slice(0,Math.min(count,shuffled.length)).map(npc=>({
    id:"c"+npc.id, npcId:npc.id,
    name:npc.name, prof:npc.prof, lv:npc.lv,
    traits:npc.traits, hireCost:npc.hireCost, wageMod:npc.wageMod,
    portrait:npc.portrait,
    quote_cs:npc.quote_cs, quote_en:npc.quote_en,
    subtitle_cs:npc.subtitle_cs, subtitle_en:npc.subtitle_en,
    loyalty:npc.loyalty, health:npc.health, mood:npc.mood,
    gender:npc.gender||"m",
    xp:0, fat:0, task:WERKSTAT_PROFS.includes(npc.prof)?"werkstat":"idle",
    seasonsInFoundry:0, incidents:0, contract:null // contract:{months,paid,roundsLeft}
  }));
}

function hireWorker(candidate){
  if(G.workers.length>=MAX_WORKERS||G.grose<candidate.hireCost)return;
  G.grose-=candidate.hireCost;
  G.workers.push({...candidate,id:"w"+Date.now()});
  G.interseason.candidates=G.interseason.candidates.filter(c=>c.id!==candidate.id);
  G.log.push(`__ECO__👷 ${candidate.name} ${G.lang==="cs"?"přijat do hutě":"hired"} (-${candidate.hireCost}g)`);
  render();
}

function fireWorker(workerId){
  if(G.workers.length<=2)return; // min 2 dělníci
  const w=G.workers.find(x=>x.id===workerId);
  if(!w||w.traits?.includes("houzevatny"))return;
  G.workers=G.workers.filter(x=>x.id!==workerId);
  G.log.push(`__ECO__👋 ${w.name} ${G.lang==="cs"?"odešel z hutě":"left the foundry"}`);
  if((w.unpaidDebt||0)>0){   // propuštěný dělník si nárok na nevyplacené mzdy odnáší → kniha pohledávek
    (G.exCrewClaims=G.exCrewClaims||[]).push({id:"c"+G.season+"_"+G.round+"_"+w.id,name:w.name,npcId:w.npcId||null,amount:w.unpaidDebt,season:G.season,round:G.round,reason:"fired"});
    G.log.push(`__ECO__📒 ${G.lang==="cs"?`Pohledávka bývalého dělníka ${w.name}: ${w.unpaidDebt}g zapsána v knize dluhů`:`Claim of former worker ${w.name}: ${w.unpaidDebt}g recorded in the ledger`}`);
  }
  render();
}

// ════════════════════════════════════════════════════════════
// FAJRUM PROCEDURAL SOUND SYNTHESIZER (Web Audio API)
// ════════════════════════════════════════════════════════════
const FajrumSfx = (() => {
  let _sfxCtx = null;
  function _getCtx() {
    if (!_sfxCtx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (AC) _sfxCtx = new AC();
    }
    if (_sfxCtx && _sfxCtx.state === 'suspended') {
      _sfxCtx.resume().catch(() => {});
    }
    return _sfxCtx;
  }

  function play(type, vol = 0.5) {
    if (typeof G !== 'undefined' && G.audio && G.audio.muted) return;
    const ctx = _getCtx();
    if (!ctx) return;
    const now = ctx.currentTime;
    const masterGain = ctx.createGain();
    const userVol = (typeof G !== 'undefined' && G.audio && typeof G.audio.volume === 'number') ? G.audio.volume : 0.7;
    masterGain.gain.setValueAtTime(Math.max(0, Math.min(1, vol * userVol)), now);
    masterGain.connect(ctx.destination);

    try {
      if (type === 'glass' || type === 'craft') {
        // Sparkling crystal glass chime
        const osc1 = ctx.createOscillator();
        const osc2 = ctx.createOscillator();
        const gain1 = ctx.createGain();
        const gain2 = ctx.createGain();
        osc1.type = 'sine';
        osc2.type = 'triangle';
        osc1.frequency.setValueAtTime(1760, now);
        osc1.frequency.exponentialRampToValueAtTime(3520, now + 0.08);
        osc2.frequency.setValueAtTime(2637, now);
        gain1.gain.setValueAtTime(0.35, now);
        gain1.gain.exponentialRampToValueAtTime(0.001, now + 0.55);
        gain2.gain.setValueAtTime(0.2, now);
        gain2.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
        osc1.connect(gain1); gain1.connect(masterGain);
        osc2.connect(gain2); gain2.connect(masterGain);
        osc1.start(now); osc1.stop(now + 0.6);
        osc2.start(now); osc2.stop(now + 0.4);
      } else if (type === 'coin') {
        // Crisp silver groschen coin jingle
        [2400, 3150, 4200].forEach((freq, i) => {
          const osc = ctx.createOscillator();
          const g = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, now + i * 0.04);
          g.gain.setValueAtTime(0.28, now + i * 0.04);
          g.gain.exponentialRampToValueAtTime(0.001, now + i * 0.04 + 0.3);
          osc.connect(g); g.connect(masterGain);
          osc.start(now + i * 0.04); osc.stop(now + i * 0.04 + 0.35);
        });
      } else if (type === 'wood' || type === 'fuel') {
        // Deep resonant wood thud
        const osc = ctx.createOscillator();
        const filter = ctx.createBiquadFilter();
        const g = ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(150, now);
        osc.frequency.exponentialRampToValueAtTime(45, now + 0.12);
        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(340, now);
        g.gain.setValueAtTime(0.55, now);
        g.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
        osc.connect(filter); filter.connect(g); g.connect(masterGain);
        osc.start(now); osc.stop(now + 0.22);
      } else if (type === 'hammer' || type === 'stone') {
        // Forge / stone / shamot impact
        const osc = ctx.createOscillator();
        const g = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(220, now);
        osc.frequency.exponentialRampToValueAtTime(55, now + 0.14);
        g.gain.setValueAtTime(0.45, now);
        g.gain.exponentialRampToValueAtTime(0.001, now + 0.24);
        osc.connect(g); g.connect(masterGain);
        osc.start(now); osc.stop(now + 0.28);
      } else if (type === 'page' || type === 'tab') {
        // Gentle parchment page rustle
        const osc = ctx.createOscillator();
        const filter = ctx.createBiquadFilter();
        const g = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(380, now);
        filter.type = 'bandpass';
        filter.frequency.setValueAtTime(750, now);
        filter.frequency.exponentialRampToValueAtTime(280, now + 0.07);
        g.gain.setValueAtTime(0.15, now);
        g.gain.exponentialRampToValueAtTime(0.001, now + 0.09);
        osc.connect(filter); filter.connect(g); g.connect(masterGain);
        osc.start(now); osc.stop(now + 0.11);
      } else if (type === 'bell' || type === 'season') {
        // Harmonic foundry bell toll
        [440, 880, 1320, 1760].forEach((freq, i) => {
          const osc = ctx.createOscillator();
          const g = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, now);
          g.gain.setValueAtTime(0.35 / (i + 1), now);
          g.gain.exponentialRampToValueAtTime(0.001, now + 1.1 + i * 0.15);
          osc.connect(g); g.connect(masterGain);
          osc.start(now); osc.stop(now + 1.4);
        });
      } else if (type === 'alert') {
        [880, 660].forEach((freq, i) => {
          const osc = ctx.createOscillator();
          const g = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, now + i * 0.1);
          g.gain.setValueAtTime(0.25, now + i * 0.1);
          g.gain.exponentialRampToValueAtTime(0.001, now + i * 0.1 + 0.22);
          osc.connect(g); g.connect(masterGain);
          osc.start(now + i * 0.1); osc.stop(now + i * 0.1 + 0.28);
        });
      }
    } catch(e) {}
  }

  return { play, getCtx: _getCtx };
})();

// Floating animated text feedback
function spawnFloatText(text, targetOrEvt, type = 'pos') {
  const el = document.createElement("div");
  el.className = "float-pill " + type;
  el.textContent = text;
  let cx = window.innerWidth / 2;
  let cy = window.innerHeight / 2;
  if (targetOrEvt) {
    if (targetOrEvt.target && targetOrEvt.target.getBoundingClientRect) {
      const rect = targetOrEvt.target.getBoundingClientRect();
      cx = rect.left + rect.width / 2;
      cy = rect.top;
    } else if (targetOrEvt.getBoundingClientRect) {
      const rect = targetOrEvt.getBoundingClientRect();
      cx = rect.left + rect.width / 2;
      cy = rect.top;
    } else if (typeof targetOrEvt.clientX === 'number') {
      cx = targetOrEvt.clientX;
      cy = targetOrEvt.clientY;
    }
  }
  el.style.left = Math.max(10, Math.min(window.innerWidth - 80, cx - 25)) + "px";
  el.style.top = Math.max(10, cy - 10) + "px";
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 950);
}

// Global Keyboard Navigation
if (typeof window !== 'undefined') {
  window.addEventListener('keydown', (e) => {
    if (['INPUT', 'TEXTAREA', 'SELECT'].includes(document.activeElement?.tagName)) return;
    if ((e.key === ' ' || e.key === 'Enter') && ['BUTTON', 'A', 'SUMMARY'].includes(document.activeElement?.tagName)) return;
    if (typeof G === 'undefined' || !G || G.phase !== 'playing') return;

    if (e.key === ' ' || e.key === 'Enter') {
      e.preventDefault();
      processRound();
      FajrumSfx.play('season', 0.6);
    } else if (e.key >= '1' && e.key <= '9') {
      const tabKeys = ['overview', 'furnace', 'production', 'storage', 'market', 'accounts', 'parta', 'log', 'archiv'];
      const idx = parseInt(e.key) - 1;
      if (idx < tabKeys.length) {
        G.tab = tabKeys[idx];
        FajrumSfx.play('page', 0.4);
        render();
      }
    } else if (e.key.toLowerCase() === 'm') {
      G.audio.muted = !G.audio.muted;
      if (G.audio.muted) {
        FurnaceAudio.stop();
      } else {
        FurnaceAudio.setPhase(G.round < PREP ? 'prep' : 'campaign');
      }
      showToast(G.lang === 'cs' ? (G.audio.muted ? '🔇 Zvuk ztlumen' : '🔊 Zvuk zapnut') : (G.audio.muted ? '🔇 Sound muted' : '🔊 Sound enabled'), []);
      render();
    } else if (e.key === 'Escape') {
      if (G._activeModal) {
        G._activeModal = null;
        render();
      }
    }
  });
}

// Craft foukaného výrobku — inputColor = konkrétní surovina/barva z it.inputs[]
function craftBlown(itemKey, inputColor){
  const it=BLOWN_ITEMS[itemKey];
  if(!it)return;
  const p=G, L=p.lang;
  const color=inputColor||it.inputs[0];
  if(!it.inputs.includes(color)){
    G.log.push(`__EVT__⛔ ${L==="cs"?"Tento vstup není povolen pro tento výrobek":"Input not allowed for this item"}`);
    render(); return;
  }
  if(!isCampaignMonth(p.round,p.seasonTier||0)||!p.fActive){
    G.log.push(`__EVT__⛔ ${L==="cs"?"Pec musí běžet (kampaň)":"Furnace must be running (campaign)"}`);
    render(); return;
  }
  const needsForma=!!it.requiresMould||["dzban","misa","dzban_forma"].includes(itemKey);
  if(needsForma&&(p.res.formy||0)<1){
    G.log.push(`__EVT__⛔ ${L==="cs"?"Chybí forma":"No mould available"}`);
    render(); return;
  }
  const missingResource=FajrumCatalog.resourceCost(it,p);
  if(missingResource){G.log.push(`__EVT__⛔ ${L==="cs"?"Chybí surovina":"Missing resource"}: ${missingResource[0]}`);render();return;}
  // Vstupní zásoba — barva/surovina je klíč v state
  const inv=[...(p[color]||[])];
  if(inv.length<it.qty){
    G.log.push(`__EVT__⛔ ${L==="cs"?"Nedostatek":"Not enough"}: ${color}`);
    render(); return;
  }
  const specialists=p.workers.filter(w=>w.prof===it.spec);
  const anyBlower=p.workers.filter(w=>["foukat_lesni","foukat_kristal","foukat_dekor","foukat_formy","tavic"].includes(w.prof));
  if(it.specOnly&&specialists.length===0){
    G.log.push(`__EVT__⛔ ${L==="cs"?"Vyžaduje specializovaného foukače":"Requires specialist glassblower"}: ${L==="cs"?PROF_CS[it.spec]:PROF_EN[it.spec]}`);
    render(); return;
  }
  if(!it.specOnly&&anyBlower.length===0){
    G.log.push(`__EVT__⛔ ${L==="cs"?"Žádný foukač v huti":"No glassblower in foundry"}`);
    render(); return;
  }
  inv.sort((a,b)=>b-a);
  const used=inv.slice(0,it.qty);
  const avgQ=Math.round(used.reduce((s,q)=>s+q,0)/it.qty);
  G[color]=inv.slice(it.qty);
  FajrumCatalog.consumeResources(it,G);
  if(needsForma)G.res.formy=Math.max(0,(G.res.formy||0)-1);
  const isSpec=specialists.length>0;
  const specLv=isSpec?specialists[0].lv:1;
  const qBonus=isSpec?Math.round(specLv*0.8):0;
  const outQ=clamp(avgQ+qBonus+(Math.random()>.6?1:0),1,5);
  const outCount=isSpec?Math.min(3,1+Math.floor(Math.random()*2.5+0.5)):1;
  // State klíč: itemKey + color suffix (jen pokud není waldglas = default)
  const stateKey=color==="waldglas"?itemKey:itemKey+"_"+color;
  if(!G[stateKey])G[stateKey]=[];
  // Terčíky: specialista → 3ks, jinak 2ks (qty=2 je výstup, ne vstup)
  const tercikBase= itemKey==="tercik"?(isSpec?3:2):null;
  const actualCount= tercikBase!==null ? tercikBase : (isSpec?Math.min(3,1+Math.floor(Math.random()*2.5+0.5)):1);
  for(let i=0;i<actualCount;i++){
    // Terčíky: quality ≤2 → výplně, quality ≥4 → žebrový terčík (prémiový)
    if(itemKey==="tercik"&&outQ<=2){
      if(!G.tercik_vyplne)G.tercik_vyplne=[];
      G.tercik_vyplne.push(outQ);
    }else if(itemKey==="tercik"&&outQ>=4){
      if(!G.tercik_zebrovy)G.tercik_zebrovy=[];
      G.tercik_zebrovy.push(outQ);
    }else{
      G[stateKey].push(outQ);
    }
  }
  const colorLabel=color!=="waldglas"?` (${COLOR_ICON[color]||color})`:"";
  // Log — terčíky ukáží kolik šlo do výplní
  if(itemKey==="tercik"){
    const goodCount=G[stateKey].length-(G[stateKey].length-actualCount+(outQ<=2?actualCount:0));
    const fillCount=outQ<=2?actualCount:0;
    const goodActual=actualCount-fillCount;
    G.log.push(`__PROD__🪟 ${goodActual>0?goodActual+"× "+(L==="cs"?"terčík":"window disc")+" "+stars(outQ):""}${fillCount>0?(goodActual>0?" + ":"")+fillCount+"× "+(L==="cs"?"výplň":"filler")+" ★★":""}${isSpec?(L==="cs"?" (spec)":" (special)"):""}`);
    spawnFloatText(`+${goodActual} 🪟 ${stars(outQ)}`, null, "pos");
  }else{
    G.log.push(`__PROD__${it.icon} ${actualCount}× ${L==="cs"?it.cs:it.en}${colorLabel} ${stars(outQ)}${isSpec?" (spec ×"+actualCount+")":""}`);
    spawnFloatText(`+${actualCount} ${it.icon} ${stars(outQ)}`, null, "pos");
  }
  FajrumSfx.play("glass", 0.6);
  render();
}

const ENGRAVE_BONUS_KEY={zlut:1.8};
function engraveBonus(k){return ENGRAVE_BONUS_KEY[k]||ENGRAVE_BONUS;}
// Žlutěný křišťál (výstup receptu "zlut") — zdroj pro rytí, definice jako u GROUND_ITEMS/BLOWN_ITEMS
const STAINED_ITEMS={zlut:{cs:"Žlutěný křišťál",en:"Stained crystal",icon:"🟨",base:30}};
function engraveSrc(k){return GROUND_ITEMS[k]||BLOWN_ITEMS[k]||STAINED_ITEMS[k]||COLORED_ENGRAVE_ITEMS[k];}

function craftGround(itemKey){
  const it=GROUND_ITEMS[itemKey];
  if(!it)return;
  const p=G, L=p.lang;
  if(!isCampaignMonth(p.round,p.seasonTier||0)){
    G.log.push(`__EVT__⛔ ${L==="cs"?"Broušení jen v kampani":"Grinding only during campaign"}`);
    render(); return;
  }
  const worker=p.workers.find(w=>w.prof===it.spec);
  if(!worker){
    G.log.push(`__EVT__⛔ ${L==="cs"?"Chybí":"Missing"}: ${L==="cs"?PROF_CS[it.spec]:PROF_EN[it.spec]}`);
    render(); return;
  }
  if(it.needsHeat&&!p.fActive){G.log.push(`__EVT__⛔ ${L==="cs"?"Pec musí běžet":"Furnace must run"}`);render();return;}
  const missingResource=FajrumCatalog.resourceCost(it,p);
  if(missingResource){G.log.push(`__EVT__⛔ ${L==="cs"?"Chybí surovina":"Missing resource"}: ${missingResource[0]}`);render();return;}
  const inv=[...(p[it.input]||[])];
  if(inv.length<it.qty){
    G.log.push(`__EVT__⛔ ${L==="cs"?"Nedostatek":"Not enough"}: ${it.input}`);
    render(); return;
  }
  inv.sort((a,b)=>b-a);
  const used=inv.slice(0,it.qty);
  const avgQ=Math.round(used.reduce((s,q)=>s+q,0)/it.qty);
  G[it.input]=inv.slice(it.qty);
  FajrumCatalog.consumeResources(it,G);
  const qBonus=Math.round(worker.lv*0.6);
  const outQ=clamp(avgQ+qBonus+(Math.random()>.5?1:0),1,5);
  if(!G[itemKey])G[itemKey]=[];
  G[itemKey].push(outQ);
  G.log.push(`__PROD__${it.icon} 1× ${L==="cs"?it.cs:it.en} ${stars(outQ)} (${L==="cs"?PROF_CS[it.spec]:PROF_EN[it.spec]})`);
  render();
}

function craftEngrave(inputKey){
  const p=G, L=p.lang;
  const rytec=p.workers.find(w=>w.prof==="rytec");
  if(!rytec){
    G.log.push(`__EVT__⛔ ${L==="cs"?"Rytec není v huti":"No engraver in foundry"}`);
    render(); return;
  }
  if(!isCampaignMonth(p.round,p.seasonTier||0)){
    G.log.push(`__EVT__⛔ ${L==="cs"?"Rytí jen v kampani":"Engraving only during campaign"}`);
    render(); return;
  }
  const inv=[...(p[inputKey]||[])];
  if(!inv.length){
    G.log.push(`__EVT__⛔ ${L==="cs"?"Žádný kus k rytí":"No piece to engrave"}`);
    render(); return;
  }
  inv.sort((a,b)=>b-a);
  const q=inv[0];
  G[inputKey]=inv.slice(1);
  const outKey="rytina_"+inputKey;
  if(!G[outKey])G[outKey]=[];
  G[outKey].push(q);
  const srcName=L==="cs"?(GROUND_ITEMS[inputKey]?.cs||BLOWN_ITEMS[inputKey]?.cs||STAINED_ITEMS[inputKey]?.cs||COLORED_ENGRAVE_ITEMS[inputKey]?.cs||inputKey):(GROUND_ITEMS[inputKey]?.en||BLOWN_ITEMS[inputKey]?.en||STAINED_ITEMS[inputKey]?.en||COLORED_ENGRAVE_ITEMS[inputKey]?.en||inputKey);
  G.log.push(`__PROD__✂️ ${L==="cs"?"Rytina na":"Engraved"} ${srcName} ${stars(q)} (+${Math.round((engraveBonus(inputKey)-1)*100)}% ${L==="cs"?"cena":"price"})`);
  render();
}

function craftSpecial(itemKey){
  const it=SPECIAL_ITEMS[itemKey];
  if(!it) return;
  const p=G, L=p.lang;
  if(!isCampaignMonth(p.round,p.seasonTier||0)||!p.fActive){
    G.log.push(`__EVT__⛔ ${L==="cs"?"Pec musí běžet (kampaň)":"Furnace must be running (campaign)"}`);
    render(); return;
  }
  if(p.season<it.minSeason){
    G.log.push(`__EVT__⛔ ${L==="cs"?"Dostupné od sezóny "+it.minSeason:"Available from season "+it.minSeason}`);
    render(); return;
  }
  // Zkontroluj dělníky
  for(const prof of it.workers){
    if(!p.workers.find(w=>w.prof===prof)){
      G.log.push(`__EVT__⛔ ${L==="cs"?"Chybí":"Missing"}: ${(L==="cs"?PROF_CS:PROF_EN)[prof]||prof}`);
      render(); return;
    }
  }
  // Validate all inventory, additive and numeric resource inputs before consuming any.
  for(const [key,qty]of Object.entries(it.inputs)){
    if(FajrumCatalog.specialHave(p,key)<qty){G.log.push(`__EVT__⛔ ${L==="cs"?"Nedostatek":"Not enough"}: ${key}`);render();return;}
  }
  for(const [key,qty]of Object.entries(it.inputs))FajrumCatalog.specialConsume(G,key,qty);
  // Výstup
  const worker=p.workers.find(w=>it.workers.includes(w.prof));
  const qBonus=worker?Math.round(worker.lv*0.6):0;
  const outQ=clamp(3+qBonus+(Math.random()>.5?1:0),1,5);
  if(!G[itemKey])G[itemKey]=[];
  G[itemKey].push(outQ);
  G.log.push(`__PROD__${it.icon} 1× ${L==="cs"?it.cs:it.en} ${stars(outQ)}`);
  render();
}

// Výpočet účinnosti pece — srdce v4
function calcFurnaceEff(furnace, panevQuality){
  const ft=FURNACE_TYPES[furnace.type];
  const runInNorm=furnace.runIn/ft.maxRunIn; // 0..1
  const shamotBonus=furnace.shamotWear<30?EFF_SHAMOT:(furnace.shamotWear<60?EFF_SHAMOT*.5:0);
  const eff=EFF_BASE+(runInNorm*EFF_RUNIN)+((panevQuality/5)*EFF_PANEV)+shamotBonus;
  return Math.min(eff, 0.92); // hard cap
}

// Toast systém
let _toastTimer=null;
function showToast(title, lines){
  let tc=document.getElementById("toastContainer");
  if(!tc){tc=document.createElement("div");tc.id="toastContainer";tc.className="toast-container";document.body.appendChild(tc);}
  tc.innerHTML="";
  const t=document.createElement("div");t.className="toast";
  if(title){const tl=document.createElement("div");tl.className="toast-title";tl.textContent=title;t.appendChild(tl);}
  lines.filter(Boolean).slice(0,8).forEach(l=>{const d=document.createElement("div");d.textContent=l;t.appendChild(d);});

// Sestavit literární zápis do kroniky
function buildChronicleEntry(round, isP, L, productionLines, economyLines, eventLines){
  const ms=L==="cs"?MONTHS_CS:MONTHS_EN;
  const lines=[];
  const prepTexts=L==="cs"?CHRON_PREP_CS:CHRON_PREP_EN;
  const campTexts=L==="cs"?CHRON_CAMP_CS:CHRON_CAMP_EN;
  const flavor=isP?prepTexts[round%prepTexts.length]:campTexts[(((round-4)%campTexts.length)+campTexts.length)%campTexts.length]; // kampaň může začít před kolem 4 (vyšší tier) → záporný index

  // Humorné příhody — šance závisí na pivu
  const beerLvl=G?.beer||0;
  const beerChance=[0.05,0.15,0.30,0.50][Math.min(beerLvl,3)];
  const roll=Math.random();
  let humorLine=null;
  if(roll<beerChance){
    const r2=Math.random();
    if(r2<0.4){
      const hi=Math.floor(Math.random()*CHRON_HUMOR_CS.length);
      const h=L==="cs"?CHRON_HUMOR_CS[hi]:CHRON_HUMOR_EN[hi];
      humorLine=`__FLAVOR__😄 ${h}`;
    }else if(r2<0.7){
      const ev=CHRON_HUMOR_BAD[Math.floor(Math.random()*CHRON_HUMOR_BAD.length)];
      humorLine=`__FLAVOR__🍺😬 ${L==="cs"?ev.cs:ev.en}`;
      if(G){
        if(ev.effect==="morale")G.morale=Math.max(0,G.morale+ev.val);
        else if(ev.effect==="panev")G.pReady=Math.max(0,G.pReady+ev.val);
        else if(ev.effect==="potash")G.res.potash=Math.max(0,G.res.potash+ev.val);
        else if(ev.effect==="charcoal")G.res.charcoal=Math.max(0,G.res.charcoal+ev.val);
        else if(ev.effect==="sand")G.res.sand=Math.max(0,G.res.sand+ev.val);
        else if(ev.effect==="varka")G.waldglas=G.waldglas.slice(0,Math.max(0,G.waldglas.length+ev.val));
      }
    }else{
      const ev=CHRON_HUMOR_GOOD[Math.floor(Math.random()*CHRON_HUMOR_GOOD.length)];
      humorLine=`__FLAVOR__🍺😄 ${L==="cs"?ev.cs:ev.en}`;
      if(G){
        if(ev.effect==="morale")G.morale=Math.min(100,G.morale+ev.val);
        else if(ev.effect==="wood")G.res.wood+=ev.val;
        else if(ev.effect==="clay")G.res.clay+=ev.val;
        else if(ev.effect==="grose")G.grose+=ev.val;
      }
    }
  }
  // Správné pořadí: měsíc → produkce → ekonomika → eventy → atmosféra
  lines.push(`__MONTH__${ms[round]}`);
  productionLines.forEach(l=>lines.push(`__PROD__${l}`));
  economyLines.forEach(l=>lines.push(`__ECO__${l}`));
  eventLines.forEach(l=>lines.push(`__EVT__${l}`));
  lines.push(`__FLAVOR__${flavor}`);
  if(humorLine) lines.push(humorLine);
  return lines;
}

// Nabídka zakázek na začátek sezóny. Nelosují se zakázky, které nelze reálně splnit:
// bez dostatečné zásoby musí termín nechat dost kol kampaně na výrobu (pec v přípravě netaví).
// waldglas: ~2 ks/kolo, křišťál: ~1 ks/kolo (vlastní receptura: čistý písek + čistá potaš + vápenec).
function contractFeasible(c,st){
  if(c.item!=="waldglas"&&c.item!=="crystal")return true;
  const have=st&&Array.isArray(st[c.item])?st[c.item].length:0;
  if(have>=c.qty)return true;
  const tier=(st&&st.seasonTier)||0;
  let firstProd=0; while(firstProd<ROUNDS&&!isCampaignMonth(firstProd,tier))firstProd++;
  const roundsLeft=c.due-firstProd+1;
  const need=c.item==="crystal"?c.qty:Math.max(1,Math.ceil(c.qty/2));
  return roundsLeft>=need;
}
function freshContracts(st){
  const pool=CONTRACT_POOL.filter(c=>contractFeasible(c,st));
  return [...pool].sort(()=>Math.random()-.5).slice(0,3);
}
