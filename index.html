            L==="cs"?"Vstoupit do hutě →":"Enter the Foundry →"),
          (()=>{
            try{
              const s=localStorage.getItem("sh_v9");
              if(s){
                const sv=JSON.parse(s);
                if(sv&&sv.season){
                  validateGameSave(sv);
                  const dt=Number.isFinite(sv._savedAt)?new Date(sv._savedAt).toLocaleString("cs-CZ",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"}):"";
                  return h("button",{class:"btn",style:{borderColor:"#c9952b",color:"#c9952b"},
                    onClick:()=>{saveguardLoad(sv);}},
                    `▶ ${L==="cs"?"Pokračovat":"Continue"}${dt?` · ${dt}`:""}`);
                }
              }
            }catch(e){}
            return null;
          })(),
          h("button",{class:"btn",onClick:()=>{G.lang=L==="cs"?"en":"cs";render();}},L==="cs"?"EN":"CZ")),
        // Citát nad obrázkem
        h("div",{style:{textAlign:"center",padding:"12px 0 8px",fontSize:"11px",
          fontStyle:"italic",color:"#8b5e34",letterSpacing:"0.3px"}},
          "Ludite et, super omnia, nolite pugnare."),
        // Obrázek POD citátem
        introImgDiv),
      h("div",{style:{textAlign:"center",padding:"8px",fontSize:"10px",color:"#8b5e34",opacity:.5}},
        "v8.0 · Multi-sezóna · Živá pec 🔥 · Barevné sklo 🎨 · ",
        h("a",{href:"/about.html",target:"_blank",style:{color:"#c9952b",opacity:.8,textDecoration:"none"}},". . . About")));
    // Leaderboard
    try{
      const lb=JSON.parse(localStorage.getItem("sh4")||"[]");
      if(lb.length){
        const sec=h("div",{class:"sec"},h("div",{class:"sec-title"},"🏆 "+(L==="cs"?"Nejlepší výsledky":"Best Results")));
        lb.slice(0,5).forEach((e,i)=>{
          sec.append(h("div",{style:{display:"flex",justifyContent:"space-between",fontSize:"12px",padding:"1px 0"}},
            h("span",null,(i+1)+". "+e.date+" · S"+e.season),h("strong",null,e.score)));
        });
        app.append(sec);
      }
    }catch{}
    return;

  }

  // ── EVENT ──
  if(p.phase==="event"&&p.curEvt){

    // ── CRACK — speciální dramatický modal ──
    if(p.curEvt==="crack"){
      const cl=G._crackLoss||{reason:"chance",wg:[],cr:[]};
      const reasonText={
        heat:{cs:"Pec byla přetopena. Žár přemohl hlínu.",en:"Furnace overheated. The heat overcame the clay."},
        age: {cs:"Pánev dosloužila. Příliš mnoho várek.",en:"The crucible gave out. Too many batches."},
        chance:{cs:"Nikdo neví proč. Tak to prostě je.",en:"No one knows why. That's how it goes."}
      }[cl.reason]||{cs:"",en:""};
      const lostLines=[];
      if(cl.wg?.length) lostLines.push(`💔 ${cl.wg.length}× ${L==="cs"?"lesní sklo":"forest glass"} ${cl.wg.map(q=>"★".repeat(Math.max(0,q||0))).join(", ")}`);
      if(cl.cr?.length) lostLines.push(`💔 ${cl.cr.length}× ${L==="cs"?"křišťál":"crystal"} ${cl.cr.map(q=>"★".repeat(Math.max(0,q||0))).join(", ")}`);
      if(!cl.wg?.length&&!cl.cr?.length) lostLines.push(L==="cs"?"✅ Sklo zachováno — jen pánev odepsána":"✅ Glass preserved — crucible lost");
      lostLines.push(L==="cs"?"🔥 Ostatní sloty pokračují":"🔥 Other slots continue");

      // CSS shake animace
      const styleId="crack-shake-style";
      if(!document.getElementById(styleId)){
        const st=document.createElement("style");
        st.id=styleId;
        st.textContent="@keyframes crackShake{0%,100%{transform:translate(0,0) rotate(0deg)}10%{transform:translate(-6px,2px) rotate(-1.5deg)}20%{transform:translate(6px,-2px) rotate(1deg)}30%{transform:translate(-4px,4px) rotate(-0.8deg)}40%{transform:translate(4px,-1px) rotate(0.5deg)}50%{transform:translate(-3px,2px) rotate(-0.3deg)}60%{transform:translate(3px,-2px) rotate(0.2deg)}80%{transform:translate(-1px,1px) rotate(-0.1deg)}}";
        document.head.appendChild(st);
      }

      // Zvuk — zavolat crack audio pokud dostupný
      try{if(FurnaceAudio&&FurnaceAudio._crack){
        FurnaceAudio._crack('sharp',FurnaceAudio.ctx?.currentTime||0,1.0);
        setTimeout(()=>FurnaceAudio._crack('deep',(FurnaceAudio.ctx?.currentTime||0)+0.08,0.8),80);
      }}catch(e){}

      const crackModal=document.createElement("div");
      crackModal.style.cssText="position:fixed;inset:0;background:rgba(40,4,4,.92);display:flex;align-items:center;justify-content:center;z-index:1000;padding:16px;";
      const crackBox=document.createElement("div");
      crackBox.className="fj-event-dialog";
      crackBox.style.cssText="background:linear-gradient(145deg,#2a0808,#1a0404);border:2px solid #8b1a1a;border-radius:8px;padding:24px 20px;max-width:340px;width:100%;text-align:center;animation:crackShake 0.6s ease-out;box-shadow:0 0 40px rgba(160,0,0,.5);";

      const icon=document.createElement("div");
      icon.className="fj-event-placeholder";
      icon.style.cssText="font-size:56px;margin-bottom:8px;filter:drop-shadow(0 0 12px #ff4444);";
      icon.textContent="💔";

      const title=document.createElement("div");
      title.style.cssText="font-family:Georgia,serif;font-size:22px;font-weight:700;color:#ff6666;margin-bottom:6px;letter-spacing:0.5px;";
      title.textContent=L==="cs"?"Pánev praskla!":"Crucible cracked!";

      const subtitle=document.createElement("div");
      subtitle.style.cssText="font-size:11px;color:#cc4444;font-style:italic;margin-bottom:14px;line-height:1.4;";
      subtitle.textContent=L==="cs"?reasonText.cs:reasonText.en;

      const lossBox=document.createElement("div");
      lossBox.style.cssText="background:rgba(0,0,0,.35);border:1px solid #6b1a1a;border-radius:6px;padding:10px 12px;margin-bottom:14px;text-align:left;";
      lostLines.forEach(line=>{
        const d=document.createElement("div");
        d.style.cssText="font-size:11px;color:#ff8888;margin-bottom:3px;font-family:Georgia,serif;";
        d.textContent=line;
        lossBox.appendChild(d);
      });

      const slotsAff=cl.slotsAffected||1;
      const tempDrop=slotsAff*8;
      const statsRow=document.createElement("div");
      statsRow.style.cssText="display:flex;gap:8px;justify-content:center;margin-bottom:16px;flex-wrap:wrap;";
      [
        {icon:"🌡️",label:(L==="cs"?"-"+tempDrop+"% teplota":"-"+tempDrop+"% temp")},
        {icon:"🏺",label:(L==="cs"?"slot "+(cl.slotIndexes||[1]).join(",")+" prázdný":"slot "+(cl.slotIndexes||[1]).join(",")+" empty")},
        {icon:"🔥",label:(L==="cs"?"ostatní sloty jedou dál":"other slots continue")},
        {icon:"😞",label:(L==="cs"?"-"+(slotsAff*8)+" nálada":"-"+(slotsAff*8)+" morale")}
      ].forEach(s=>{
        const chip=document.createElement("div");
        chip.style.cssText="background:rgba(160,0,0,.2);border:1px solid #6b1a1a;border-radius:4px;padding:3px 8px;font-size:10px;color:#ff8888;";
        chip.textContent=s.icon+" "+s.label;
        statsRow.appendChild(chip);
      });

      const chron=document.createElement("div");
      chron.style.cssText="font-size:10px;color:#884444;font-style:italic;margin-bottom:16px;line-height:1.5;border-top:1px solid #4a1a1a;padding-top:10px;";
      const chronTexts={
        cs:[`„Praskot byl slýšet až na druhém konci hvozdu.“`,`„Hanns se zastavil, podíval se na střepy a neřekl nic.“`,`„Rok 1680. Pánev nevydřela. Sklovina se rozlila po výhni.“`],
        en:["\"The crack echoed through the forest.\"","\"Hanns stopped, looked at the shards, and said nothing.\"","\"Year 1680. The crucible gave out. Glass spilled across the hearth.\""]
      };
      chron.textContent=(L==="cs"?chronTexts.cs:chronTexts.en)[Math.floor(Math.random()*3)];

      const btn=document.createElement("button");
      btn.className="btn btn-danger";
      btn.style.cssText="width:100%;padding:10px;font-size:13px;font-family:Georgia,serif;";
      btn.textContent=L==="cs"?"Smolař — rozumím":"Tough luck — understood";
      btn.onclick=dismissCrackLoss;

      crackBox.append(icon,title,subtitle,lossBox,statsRow,chron,btn);
      crackModal.appendChild(crackBox);
      app.appendChild(crackModal);
      return;
    }

    const evtData={
      crack:{i:"💔",cs:"Prasklá pánev!",en:"Cracked crucible!",
        dcs:"Pánev nevydržela žár. Várka je ztracena.",den:"The crucible cracked. Batch lost."},
      good:{i:"✨",cs:"Vydařená várka!",en:"Excellent batch!",
        dcs:"Dělníci jsou spokojeni. Morálka roste.",den:"Workers are pleased. Morale increases."},
      merchant:{i:"🗣️",cs:"Kupec Weiss přijel!",en:"Merchant Weiss arrived!",
        dcs:"Ceny jsou dnes lepší. Prodej výhodně.",den:"Prices are better today. Sell wisely."},
      winter:{i:"❄️",cs:"Krutá zima!",en:"Harsh winter!",
        dcs:"Mráz pohltil zásoby dřeva a nahlodal morálku.",den:"Frost ate into wood supplies and morale."},
      shamotCrack:{i:"🧱",cs:"Šamot praská!",en:"Shamot cracking!",
        dcs:"Vyzdívka pece je kriticky poškozena. Pec chladne.",den:"Furnace lining critically damaged. Furnace cooling."},
      forestDepleted:{i:"🌲",cs:"Hvozd vyčerpán!",en:"Forest depleted!",
        dcs:`Les je prázdný. Dřevo musíš kupovat od Weisse (${WOOD_EMERGENCY_PRICE}g/ks) nebo sázet nové stromy. Les se obnoví za 2–3 sezóny.`,
        den:`The forest is bare. Buy wood from Weiss (${WOOD_EMERGENCY_PRICE}g/unit) or plant new trees. Recovery takes 2–3 seasons.`},
      svjiri:{i:"💨",cs:"Hlásí se foukači a brusiči — Sv. Jiří",en:"Blowers and grinders apply — St. George",
        dcs:"Kampaň na Sv. Jiří přilákala foukače a brusiče z okolí. Další sezóny mohou být jiné. Na Trhu je možné je najmout co nejdříve.",
        den:"St. George's campaign drew blowers and grinders from the region. Next seasons can be different. Hire them at the Market as soon as possible."}
    };
    const ev=evtData[p.curEvt]||{i:"📜",cs:p.curEvt,en:p.curEvt,dcs:"",den:""};
    const evModal=h("div",{class:"modal-bg",onClick:dismissEvt},
      h("div",{class:"modal fj-event-dialog",style:{maxWidth:"360px",textAlign:"center"},onClick:e=>e.stopPropagation()},
        h("div",{class:"fj-event-placeholder",style:{fontSize:"48px",marginBottom:"10px"}},ev.i),
        h("h2",{style:{fontSize:"18px",margin:"0 0 8px"}},L==="cs"?ev.cs:ev.en),
        h("p",{style:{fontSize:"13px",color:"#8b5e34",marginBottom:"20px",lineHeight:"1.5"}},L==="cs"?ev.dcs:ev.den),
        h("button",{class:"btn btn-p",onClick:dismissEvt},L==="cs"?"Rozumím":"OK")));
    app.append(evModal);
    return;
  }

  // ── KRONIKA SKLÁŘSKÉHO RODU — ZÁNIK HUTĚ (GAME OVER) ──
  if(p.phase==="game_over"){
    FurnaceAudio.stop();
    const fReason = p.failureReason || "abandoned";
    const st = p.failureStats || {
      season: p.season || 1, round: p.round || 1,
      batches: G.totalBatches || 0, sold: G.totalSold || 0,
      contracts: G.totalDone || 0, debtPaid: G.totalDebtPaid || 0,
      maxFama: 0
    };

    const restartGame = restartAfterFall;

    const hdr = h("div", {class: "hdr", style: {background: "linear-gradient(180deg, rgba(42,26,10,.95) 0%, rgba(20,12,5,.98) 100%)", color: "#e8d8c8", borderBottom: "2px solid #8b3a2a"}},
      h("div", null,
        h("h1", {style: {color: "#e27d60", fontSize: "17px", display: "flex", alignItems: "center", gap: "6px"}},
          "📜 "+(L==="cs"?"KRONIKA SKLÁŘSKÉHO RODU — ZÁNIK HUTĚ":"CHRONICLE OF THE GLASSHOUSE — THE FALL")),
        h("small", {style: {color: "#c9952b", fontSize: "11px"}},
          L==="cs"
            ?`Sezóna ${st.season} · Měsíc ${st.round} · Léta Páně ${1679+st.season}`
            :`Season ${st.season} · Month ${st.round} · Year of our Lord ${1679+st.season}`)));

    const body = h("div", {style: {padding: "14px", overflowY: "auto", flex: "1", background: "#f5eee6"}});

    // Příběhové vyprávění
    let reasonTitle = "";
    let reasonStory = "";
    let reasonIcon = "🏚️";

    if(fReason === "abandoned"){
      reasonIcon = "🏚️";
      reasonTitle = L==="cs" ? "Huť osiřela — taviči a tovaryši odešli" : "Foundry deserted — all glassmakers left";
      reasonStory = L==="cs"
        ? "Huť v hlubokých lužických hvozdech ztichla. Bez jídla, piva a spravedlivých mezd sbalili tovaryši své nářadí a odešli za obživou jinam. Nakonec i starý mistr František Kunc s těžkým srdcem uhasil oheň v peci, zavřel verštat a přes horské hřebeny se vydal do saských hutí. Za první zimy roztrhal mráz studenou pec a huť zarostla mechem a kapradím."
        : "The glasshouse in the deep Lusatian forests fell silent. Without food, beer, or fair wages, the journeymen packed their tools and left to seek bread elsewhere. In the end, even master František Kunc with a heavy heart put out the furnace fire, shuttered the benches, and crossed the mountain ridges to Saxony. In the first winter, frost shattered the cold stones and moss reclaimed the site.";
    } else if(fReason === "foreclosure"){
      reasonIcon = "⚖️";
      reasonTitle = L==="cs" ? "Panská exekuce a zabavení huti věřiteli" : "Manorial foreclosure and confiscation";
      reasonStory = L==="cs"
        ? "Panský hejtman hraběcího panství v doprovodu rychtáře a ozbrojených biřiců přitloukl na vrata huti exekuční pečeť. Pro nesplatitelné dluhy a neuhrazené účty u Faktora Weisse byla celá sklárna zabavena. Pánve a zásoby křišťálu šly do dražby v České Lípě a správu huti převzal cizí faktor."
        : "The estate bailiff, accompanied by the reeve and armed guards, nailed the foreclosure seal upon the foundry gates. For insurmountable debt and unpaid credit to Factor Weiss, the entire glasshouse was confiscated. Crucibles and glass stocks were auctioned in Česká Lípa, and management handed to an outside overseer.";
    } else {
      reasonIcon = "🌋";
      reasonTitle = L==="cs" ? "Zkáza pece a úplný rozpad huti" : "Collapse of the furnace and ruin of the workshop";
      reasonStory = L==="cs"
        ? "Vyčerpaná a popraskaná pec nevydržela žár tavení. Šamotová klenba se zřítila a všechny zbývající pánve byly zničeny. Bez peněz na novou stavbu, bez jílu a bez zralých pánví už huť nemohla obnovit oheň. Místo sklářské slávy zbyly jen ohořelé trámy a hromada střepů."
        : "The exhausted, cracked furnace could not withstand the heat of the melt. The shamot vault caved in, destroying all remaining crucibles. With no coin for rebuilding, no clay, and no ready crucibles, the fire could never be relit. Only charred beams and rubble remain.";
    }

    const storyBox = h("div", {style: {background: "rgba(160,48,32,.08)", border: "1px solid rgba(160,48,32,.25)", borderRadius: "6px", padding: "12px 14px", marginBottom: "14px"}});
    storyBox.append(
      h("div", {style: {display: "flex", alignItems: "center", gap: "8px", marginBottom: "8px"}},
        h("span", {style: {fontSize: "24px"}}, reasonIcon),
        h("h2", {style: {fontSize: "15px", color: "#a03020", margin: 0, fontWeight: "700"}}, reasonTitle)),
      h("p", {style: {fontSize: "12px", color: "#4a2a14", lineHeight: "1.6", margin: 0, fontStyle: "italic"}}, reasonStory)
    );
    body.append(storyBox);

    // Statistiky působení
    const statsSec = h("div", {class: "sec", style: {marginBottom: "14px"}});
    statsSec.append(h("div", {class: "sec-title"}, "📊 "+(L==="cs"?"Zápis v huťské knize (Dosažené výsledky)":"Foundry Chronicle (Tenure Record)")));
    const statGrid = h("div", {style: {display: "grid", gridTemplateColumns: "1fr 1fr", gap: "8px"}});
    [
      {label: L==="cs"?"Doba vedení hutě":"Tenure length", val: `${st.season} ${L==="cs"?"sezón":"seasons"} · ${st.round} ${L==="cs"?"měsíců":"months"}`},
      {label: L==="cs"?"Uvařeno skloviny":"Glass batches melted", val: `🔥 ${st.batches} ${L==="cs"?"várek":"batches"}`},
      {label: L==="cs"?"Prodané výrobky":"Glassware sold", val: `✨ ${st.sold} ${L==="cs"?"kusů":"pieces"}`},
      {label: L==="cs"?"Splněné zakázky":"Contracts fulfilled", val: `📜 ${st.contracts}`},
      {label: L==="cs"?"Splaceno dluhů":"Debt repaid", val: `💰 ${st.debtPaid}g`},
      {label: L==="cs"?"Nejvyšší věhlas (Fama)":"Highest Fama", val: `⭐ ${st.maxFama}/100`}
    ].forEach(s => {
      statGrid.append(h("div", {style: {padding: "8px", background: "rgba(0,0,0,.04)", borderRadius: "4px"}},
        h("div", {style: {fontSize: "10px", color: "#8b5e34"}}, s.label),
        h("div", {style: {fontSize: "13px", fontWeight: "700", color: "#2a1a0a", marginTop: "2px"}}, s.val)));
    });
    statsSec.append(statGrid);
    body.append(statsSec);

    // Rady mistrů pro příští pokus
    const tipsBox = h("div", {style: {background: "rgba(74,122,58,.08)", border: "1px solid rgba(74,122,58,.25)", borderRadius: "6px", padding: "12px 14px", marginBottom: "16px"}});
    tipsBox.append(h("div", {style: {fontSize: "11px", fontWeight: "700", color: "#4a7a3a", marginBottom: "8px"}},
      "💡 "+(L==="cs"?"POUČENÍ ZE ZÁNIKU — RADY PRO NOVOU HUŤ":"LESSONS FROM THE FALL — MASTER ADVICE")));

    const tipsList = [
      L==="cs"?"🍞 Zásoba jídla a piva: Nenechávej zásoby jídla na nule. Alespoň 1 díl piva udrží morálku a věrnost dělníků."
             :"🍞 Provisions: Keep food in stock. At least 1 beer ration maintains morale and worker loyalty.",
      L==="cs"?"⏳ Odklad splátek u Faktora Weisse: Pokud v zimě chybí groše na mzdy, vyjednej u Weisse 2 kola odkladu splátek."
             :"⏳ Debt moratorium: When winter cash is tight for wages, negotiate a 2-round repayment deferral with Weiss.",
      L==="cs"?"📦 Neprodávej pozdě: Nenechávej hotové sklo ležet na skladě — proměň ho u Weisse nebo na Trhu v groše pro provoz."
             :"📦 Liquidate inventory: Sell finished glass promptly at Market or quick-sell to Weiss for operational cashflow.",
      L==="cs"?"🏺 Pánve potřebují 2 kola: Káninský musí šlapat jíl dříve, než stará pánev doslouží a praskne."
             :"🏺 Crucibles take time: Have Káninský prepare crucibles well before the working one fractures."
    ];
    tipsList.forEach(tip => tipsBox.append(h("div", {style: {fontSize: "11px", color: "#3a2a14", marginBottom: "5px", lineHeight: "1.4"}}, tip)));
    body.append(tipsBox);

    // Tlačítka akcí
    const btnRow = h("div", {style: {display: "flex", gap: "8px", flexWrap: "wrap"}});
    btnRow.append(
      h("button", {class: "btn btn-p", style: {flex: "1", minWidth: "180px", padding: "12px", fontSize: "14px", fontWeight: "700"},
        onClick: restartGame},
        "🔥 "+(L==="cs"?"Založit novou huť (Zkusit znovu)":"Found New Glasshouse (Retry)")),
      h("button", {class: "btn btn-s", style: {padding: "12px", fontSize: "13px"},
        onClick: () => { G.tab = "log"; G.phase = "playing"; render(); }},
        "📖 "+(L==="cs"?"Prohlédnout Kroniku":"View Chronicle"))
    );
    body.append(btnRow);

    app.append(hdr, body);
    return;
  }

  // ── MEZISEZÓNA ──
  if(p.phase==="interseason"||p.phase==="interseasonPhase"){
    if(p.phase==="interseasonPhase"){startInterseason();return;}
    const is=p.interseason||{};
    const sc=is.seasonScore||{};
    const total=totalScore(sc);
    const shamotWear=p.furnace.shamotWear;
    const canRepair=p.res.clay>=4&&p.res.limestone>=2&&p.grose>=8;
    const canUpgradeStone=p.furnace.type==="primitive"&&
      p.res.wood>=UPGRADE_COST.stone.wood&&p.res.limestone>=UPGRADE_COST.stone.limestone&&
      p.res.clay>=UPGRADE_COST.stone.clay&&p.grose>=UPGRADE_COST.stone.grose;
    const canUpgradeMaster=p.furnace.type==="stone"&&
      p.res.wood>=UPGRADE_COST.master.wood&&p.res.limestone>=UPGRADE_COST.master.limestone&&
      p.res.clay>=UPGRADE_COST.master.clay&&p.grose>=UPGRADE_COST.master.grose;

    app.append(
      h("div",{class:"hdr"},
        h("div",null,
          h("h1",null,"🌿 "+(L==="cs"?"Mezisezóna":"Between Seasons")),
          h("small",null,`${L==="cs"?"Sezóna":"Season"} ${p.season} → ${p.season+1} · ${1679+p.season+1}`))));

    const body=h("div",{style:{padding:"14px",overflowY:"auto",flex:"1"}});

    // Shrnutí sezóny
    body.append(h("div",{class:"sec-title"},L==="cs"?"Výsledky sezóny":"Season Results"));
    const scoreGrid=h("div",{class:"interseason-grid"});
    [
      ["🔥 Waldglas",sc.waldglas],["✨ Křišťál",sc.crystal],
      ["⭐ Kvalita",sc.quality],["📜 Zakázky",sc.contracts],
      ["💰 Groše",sc.grose],["🌲 Les",sc.forest]
    ].forEach(([l,v])=>{
      scoreGrid.append(h("div",{class:"interseason-card"},
        h("div",{style:{fontSize:"10px",color:"#8b5e34",marginBottom:"2px"}},l),
        h("div",{style:{fontSize:"18px",fontWeight:"700"}},v||0)));
    });
    scoreGrid.append(h("div",{class:"interseason-card",style:{gridColumn:"1/-1",background:"rgba(139,94,52,.08)"}},
      h("div",{style:{fontSize:"10px",color:"#8b5e34",marginBottom:"2px"}},L==="cs"?"CELKEM SEZÓNA":"SEASON TOTAL"),
      h("div",{style:{fontSize:"22px",fontWeight:"700",color:"#c9952b"}},total)));
    body.append(scoreGrid);

    // Stav pece
    body.append(h("div",{class:"sec-title",style:{marginTop:"10px"}},L==="cs"?"Stav pece":"Furnace Status"));
    const furnCard=h("div",{class:"furnace-card"});
    furnCard.append(
      h("div",{class:"furnace-stat"},
        h("span",null,L==="cs"?"Typ":"Type"),
        h("strong",null,L==="cs"?ft.name:ft.nameEn)),
      h("div",{class:"furnace-stat"},
        h("span",null,L==="cs"?"Zaběhnutost (přenos)":"Run-in (carryover)"),
        h("strong",null,p.furnace.runIn+"%")),
      h("div",null,effBar(p.furnace.runIn,p.furnace.runIn>50?"#4a7a3a":"#c9952b")),
      h("div",{class:"furnace-stat",style:{marginTop:"6px"}},
        h("span",null,L==="cs"?"Opotřebení šamotu":"Shamot wear"),
        h("strong",{style:{color:shamotWear>=80?"#a03020":shamotWear>=50?"#c9952b":"#4a7a3a"}},shamotWear+"%")),
      h("div",null,effBar(shamotWear,shamotWear>=80?"#a03020":shamotWear>=50?"#c9952b":"#4a7a3a")));

    if(is.shamotNeedRepair){
      furnCard.append(h("div",{style:{marginTop:"8px",padding:"6px",background:"rgba(160,48,32,.08)",borderRadius:"4px",fontSize:"11px",color:"#a03020"}},
        (is.shamotCritical?"⚠️ ":"🔧 ")+(L==="cs"?"Šamot potřebuje opravu":"Shamot needs repair"),
        h("br",null),
        h("span",{style:{fontSize:"10px",color:"#8b5e34"}},"Cena: 4🧱 + 2🪨 + 8g")));
      furnCard.append(h("button",{
        class:"btn btn-s"+(canRepair?"":" btn-danger"),
        style:{marginTop:"4px",opacity:canRepair?1:.5},
        onClick:()=>{if(canRepair)repairShamot();}},
        L==="cs"?"Opravit šamot (8g)":"Repair shamot (8g)"));
    }
    body.append(furnCard);

    // Upgrade pece
    if(p.furnace.type!=="master"){
      body.append(h("div",{class:"sec-title",style:{marginTop:"10px"}},L==="cs"?"Upgrade pece":"Furnace Upgrade"));
      if(p.furnace.type==="primitive"){
        const uc=UPGRADE_COST.stone;
        body.append(h("button",{
          class:"btn"+(canUpgradeStone?" btn-p":""),"data-furnace-preview":"stone",
          style:{width:"100%",marginBottom:"4px",opacity:canUpgradeStone?1:.5},
          onClick:()=>{if(canUpgradeStone)upgradeFurnace("stone");}},
          `🔥 ${L==="cs"?"Zděná pec":"Stone furnace"} (${uc.wood}🌳 + ${uc.limestone}🟩 + ${uc.clay}🧱 + ${uc.grose}g)`));
      }
      if(p.furnace.type==="stone"){
        const uc=UPGRADE_COST.master;
        body.append(h("button",{
          class:"btn"+(canUpgradeMaster?" btn-p":""),"data-furnace-preview":"master",
          style:{width:"100%",marginBottom:"4px",opacity:canUpgradeMaster?1:.5},
          onClick:()=>{if(canUpgradeMaster)upgradeFurnace("master");}},
          `🔥 ${L==="cs"?"Mistrovská pec":"Master furnace"} (${uc.wood}🌳 + ${uc.limestone}🟩 + ${uc.clay}🧱 + ${uc.grose}g)`));
      }
    }

    // Les + sklad skla přenesený
    body.append(h("div",{class:"sec-title",style:{marginTop:"10px"}},L==="cs"?"Hvozd & Sklad":"Forest & Storage"));
    const regenLine=h("div",{style:{display:"flex",alignItems:"center",gap:"8px",marginBottom:"4px",fontSize:"12px"}});
    regenLine.append(h("span",{style:{color:"#4a7a3a"}},`🌲 +${is.forestRegen||FOREST_REGEN_BASE} → ${p.forest}/${p.forestMax||INIT_FOREST}`));
    if(is.reforestBonus>0)regenLine.append(h("span",{style:{color:"#4a7a3a",fontSize:"11px"}},`(🌱 výsadba +${is.reforestBonus})`));
    if(p.forest<(p.forestMax||INIT_FOREST))regenLine.append(h("span",{style:{color:"#8b5e34",fontSize:"11px"}},L==="cs"?`chybí ${(p.forestMax||INIT_FOREST)-p.forest} parcel`:`${(p.forestMax||INIT_FOREST)-p.forest} missing`));
    body.append(regenLine);
    if(p.forest===0){
      body.append(h("div",{style:{fontSize:"11px",color:"#a03020",padding:"6px",
        background:"rgba(160,48,32,.08)",borderRadius:"4px",marginBottom:"6px",lineHeight:"1.5"}},
        L==="cs"
          ?`🌲 Hvozd je vyčerpán. Přidej dělníky na Výsadbu (příprava i kampaň) — každé kolo výsadby přidá +${p.difficulty==="easy"?3:2} parcely, započítají se max. 4 kola za sezónu. Přirozená obnova vyčerpaného lesa: +2/sezónu.`
          :`🌲 Forest depleted. Assign workers to Reforest (prep or campaign) — each planting round adds +${p.difficulty==="easy"?3:2} parcels, max 4 rounds count per season. Natural recovery of a depleted forest: +2/season.`));
    }
    const storedTotal=p.waldglas.length+p.crystal.length;
    if(storedTotal>0){
      const storageCost=storedTotal*STORAGE_COST_PER_ITEM;
      body.append(h("div",{style:{fontSize:"12px",color:"#8b5e34",marginBottom:"8px",
        padding:"6px",background:"rgba(139,94,52,.06)",borderRadius:"4px"}},
        `📦 ${L==="cs"?"Sklad přenáší":"Storage carries"}: 🔥${p.waldglas.length} + ✨${p.crystal.length} ${L==="cs"?"kusů":"pieces"}`,
        h("br",null),
        h("span",{style:{fontSize:"11px",color:"#a03020"}},`💸 ${L==="cs"?"Náklady skladu":"Storage cost"}: ${storageCost}g`)));
    }

    // Baranovský — nabídka přísad
    if(p.baranOffer){
      const bo=p.baranOffer;
      const ad=ADDITIVES[bo.item];
      const canBuy=p.grose>=bo.price;
      const baranSec=h("div",{class:"sec-title","data-partner":"baranovsky",style:{marginTop:"10px"}},
        `🗣️ ${L==="cs"?"Baranovský přišel s nabídkou":"Baranovský has an offer"}`);
      const baranCard=h("div",{class:"fj-additive-offer","data-additive":bo.item,style:{padding:"8px",background:"rgba(201,149,43,.08)",
        border:"1px solid rgba(201,149,43,.25)",borderRadius:"4px",marginBottom:"8px"}});
      baranCard.append(
        h("div",{style:{fontSize:"12px",color:"#3a2a14",marginBottom:"4px",fontStyle:"italic"}},
          `„${L==="cs"?bo.cs:bo.en}"`),
        h("div",{style:{fontSize:"11px",color:"#8b5e34",marginBottom:"6px"}},
          `${ad?.icon} ${bo.qty}× ${L==="cs"?ad?.cs:ad?.en} — ${bo.price}g`),
        h("button",{
          class:"btn"+(canBuy?" btn-p":""),
          style:{width:"100%",opacity:canBuy?1:.5},
          onClick:()=>{if(canBuy)buyBaranOffer();}},
          canBuy?(L==="cs"?"Koupit":"Buy"):(L==="cs"?"Nedostatek grošů":"Not enough groats")));
      body.append(baranSec,baranCard);
    }

    // Nástěnka — nábor
    body.append(h("div",{class:"sec-title",style:{marginTop:"10px"}},
      `👷 ${L==="cs"?"Nástěnka — nábor":"Job Board — Hiring"} (${p.workers.length}/${MAX_WORKERS})`));

    // Stávající dělníci s tlačítkem propustit
    const curSec=h("div",{style:{marginBottom:"8px"}});
    p.workers.forEach(w=>{
      const canFire=p.workers.length>2&&!w.traits?.includes("houzevatny");
      const xpNeeded=XP_PER_LEVEL[w.lv-1]||999;
      const xpPct=Math.round(((w.xp||0)/xpNeeded)*100);
      const row=h("div",{style:{display:"flex",alignItems:"center",gap:"6px",padding:"4px 0",
        borderBottom:"1px solid rgba(42,26,10,.07)",fontSize:"11px"}});
      row.append(
        h("span",{style:{flex:1}},
          `${w.name} ${stars(w.lv)} · ${L==="cs"?PROF_CS[w.prof]||w.prof:PROF_EN[w.prof]||w.prof}`,
          w.traits?.length?h("span",{style:{marginLeft:"4px",fontSize:"10px",color:"#8b5e34"}},
            w.traits.map(t=>TRAITS[t]?.icon||"").join("")):null),
        h("span",{style:{fontSize:"10px",color:"#8b5e34",minWidth:"40px"}},`XP ${xpPct}%`),
        h("button",{
          class:"btn btn-s"+(canFire?"":" "),
          style:{fontSize:"10px",opacity:canFire?1:.4,
            ...(canFire?{background:"rgba(160,48,32,.1)",color:"#a03020",borderColor:"rgba(160,48,32,.2)"}:{})},
          onClick:()=>{if(canFire){fireWorker(w.id);}}},
          L==="cs"?"Propustit":"Fire"));
      curSec.append(row);
    });
    body.append(curSec);

    // Kandidáti — rozděleni na specialisty a obecné
    if(is.candidates?.length&&p.workers.length<MAX_WORKERS){
      const specProfs=["foukat_lesni","foukat_kristal","foukat_dekor","foukat_formy","brusic_hrana","brusic_kulic","rytec"];
      const specCands=is.candidates.filter(c=>specProfs.includes(c.prof));
      const genCands=is.candidates.filter(c=>!specProfs.includes(c.prof));

      // Foukači/brusiči — zvýrazněná sekce
      if(specCands.length>0){
        const isFoukSeason=p.season===1&&specCands.some(c=>c.prof.startsWith("foukat_"));
        const isBrusSeason=p.season>=2&&specCands.some(c=>["brusic_hrana","brusic_kulic","rytec"].includes(c.prof));
        const specHdr=h("div",{style:{
          padding:"8px 10px",marginBottom:"6px",borderRadius:"4px",
          background:"rgba(201,149,43,.08)",border:"1px solid rgba(201,149,43,.25)"}});
        specHdr.append(
          h("div",{style:{fontWeight:"700",fontSize:"12px",color:"#c9952b",marginBottom:"3px"}},
            isFoukSeason?"💨 "+(L==="cs"?"Hlásí se foukači — Sv. Jiří":"Glassblowers apply — St. George's Day")
            :isBrusSeason?"💎 "+(L==="cs"?"Přicházejí brusiči a rytci":"Grinders and engravers arrive")
            :"⚒️ "+(L==="cs"?"Hlásí se specialisté":"Specialists applying")),
          h("div",{style:{fontSize:"10px",color:"#8b5e34",fontStyle:"italic"}},
            isFoukSeason
              ?(L==="cs"?"Kampaň na Sv. Jiří přilákala foukače z okolí. Příští sezóna může být jiná."
                        :"St. George's campaign drew blowers from the region. Next season can be different.")
              :(L==="cs"?"Pověst hutě se šíří. Mistři hledají práci."
                        :"The foundry's reputation spreads. Masters seek work.")));
        body.append(specHdr);
        specCands.forEach(c=>buildCandidateCard(c,body,p,L));
      }

      // Obecní kandidáti
      if(genCands.length>0){
        body.append(h("div",{style:{fontSize:"11px",color:"#8b5e34",margin:"8px 0 4px",fontWeight:"600"}},
          L==="cs"?"Hledají práci:":"Looking for work:"));
        genCands.forEach(c=>buildCandidateCard(c,body,p,L));
      }
    }else if(p.workers.length>=MAX_WORKERS){
      body.append(h("div",{style:{fontSize:"11px",color:"#8b5e34",marginBottom:"4px"}},
        L==="cs"?"Huť je plná (6/6). Propusť někoho pro nábor.":"Foundry full (6/6). Fire someone to hire."));
    }

    // Rozšíření provozu huti a sezónní tiery
    renderSeasonUpgrades(body, true);

    // Tlačítko nová sezóna
    body.append(h("button",{
      class:"btn btn-p",
      style:{width:"100%",padding:"12px",fontSize:"14px",marginTop:"10px"},
      onClick:startNewSeason},
      L==="cs"?`Začít sezónu ${p.season+1} →`:`Start Season ${p.season+1} →`));

    app.append(body);
    return;
  }

  // ── SUMMARY ──
  if(p.phase==="summary"&&p.summary){
    const sd=p.summary, pr=p.round-1;
    const hdr=h("div",{class:"hdr"},
      h("span",{style:{fontWeight:"700"}},ms[pr]+" — "+(pr<PREP?(L==="cs"?"Příprava":"Prep"):(L==="cs"?"Kampaň":"Campaign"))));
    const body=h("div",{class:"sec",style:{overflowY:"auto",maxHeight:"calc(100vh - 140px)"}});

    // ── SKLAD SKLA + EKONOMIKA (původní 2-sloupcový grid) ──
    const grid=h("div",{style:{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"8px",marginBottom:"10px"}});
    grid.append(
      h("div",{style:{padding:"8px",background:"rgba(74,122,58,.08)",borderRadius:"4px"}},
        h("div",{style:{fontSize:"10px",color:"#4a7a3a",fontWeight:"700"}},L==="cs"?"SKLAD SKLA":"GLASS STOCK"),
        h("div",{style:{fontSize:"18px",fontWeight:"700"}},"🔥 "+p.waldglas.length),
        p.crystal.length?h("div",{style:{fontSize:"12px",color:"#3a6a9a"}},"✨ "+p.crystal.length):null,
        h("div",{style:{fontSize:"9px",color:"#8b5e34",marginTop:"2px",fontStyle:"italic"}},L==="cs"?"kusů čeká na prodej":"pieces awaiting sale")),
      h("div",{style:{padding:"8px",background:"rgba(139,94,52,.08)",borderRadius:"4px"}},
        h("div",{style:{fontSize:"10px",color:"#8b5e34",fontWeight:"700"}},L==="cs"?"EKONOMIKA":"ECONOMY"),
        h("div",{style:{fontSize:"18px",fontWeight:"700"}},"💰 "+p.grose+"g"),
        p.debt>0?h("div",{style:{fontSize:"11px",color:"#a03020"}},"📜 "+(L==="cs"?"Weiss ":"Weiss ")+p.debt+"g"):null,
        liabilities(p).crew>0?h("div",{style:{fontSize:"11px",color:"#a03020"}},"👥 "+(L==="cs"?"parta ":"crew ")+liabilities(p).crew+"g"):null));
    body.append(grid);

    // ── STAV HUTĚ ──
    body.append(
      h("div",{style:{fontSize:"11px",color:"#8b5e34",marginBottom:"3px"}},`🔥 ${L==="cs"?"Pec":"Furnace"}: eff ${sd.fEff}%${sd.furnTemp!=null?" · 🌡️ "+sd.furnTemp+"%":""} · ${L==="cs"?"zaběhnutost":"run-in"} ${p.furnace.runIn}%`),
      h("div",{style:{fontSize:"11px",color:"#8b5e34",marginBottom:"3px"}},`🌲 ${L==="cs"?"Hvozd":"Forest"}: ${p.forest}/${p.forestMax||INIT_FOREST}${sd.fCut?" (-"+sd.fCut+")":""}`),
      h("div",{style:{fontSize:"11px",color:"#8b5e34",marginBottom:"8px"}},`🏺 ${L==="cs"?"Pánve":"Crucibles"}: ${p.pReady} + ${p.pAging.length} ${L==="cs"?"zrají":"aging"} · ${L==="cs"?"kval.":"qual."} ${stars(p.panevQuality)}`));

    // ── CO SE UDÁLO — produkce + těžba ──
    const prodBox=h("div",{style:{background:"rgba(74,122,58,.06)",borderRadius:"4px",padding:"8px 10px",marginBottom:"8px",borderLeft:"3px solid #4a7a3a"}});
    prodBox.append(h("div",{style:{fontSize:"10px",fontWeight:"700",color:"#4a7a3a",marginBottom:"5px"}},L==="cs"?"⚗️ PRODUKCE KOLA":"⚗️ ROUND PRODUCTION"));
    // Sklo
    const newWgS=(p.waldglas?.length||0), newCrS=(p.crystal?.length||0);
    if(newWgS>0||newCrS>0){
      prodBox.append(h("div",{style:{fontSize:"11px",marginBottom:"3px",color:"#3a2a14"}},
        `🔥 ${newWgS}× waldglas${newCrS>0?" · ✨ "+newCrS+"× křišťál":""} ${L==="cs"?"na skladě":"in stock"}`));
    }
    // Přírůstek produkce tohoto kola (starší save ve fázi summary tato pole nemá)
    const sumGainW=sd.prodW||0, sumGainC=sd.prodC||0, sumGainP=sd.newPanve||0;
    if(sumGainW>0||sumGainC>0||sumGainP>0){
      const gainParts=[];
      if(sumGainW>0)gainParts.push(`🔥 +${sumGainW}× waldglas`);
      if(sumGainC>0)gainParts.push(`✨ +${sumGainC}× ${L==="cs"?"křišťál":"crystal"}`);
      if(sumGainP>0)gainParts.push(`🏺 +${sumGainP}× ${L==="cs"?"pánev hotová":"crucible ready"}`);
      prodBox.append(h("div",{style:{fontSize:"11px",fontWeight:"700",marginBottom:"4px",color:"#4a7a3a"}},
        `${L==="cs"?"Přírůstek":"Gained"}: ${gainParts.join(" · ")}`));
    }
    // Suroviny delta
    const resReport=[
      {icon:"🪵",label:L==="cs"?"Dřevo":"Wood",k:"wood"},{icon:"🏖️",label:L==="cs"?"Písek":"Sand",k:"sand"},
      {icon:"🌿",label:L==="cs"?"Potaš":"Potash",k:"potash"},{icon:"🪨",label:L==="cs"?"Vápenec":"Limestone",k:"limestone"},
      {icon:"💧",label:L==="cs"?"Voda":"Water",k:"water"},{icon:"🧱",label:L==="cs"?"Jíl":"Clay",k:"clay"},
      {icon:"🍞",label:L==="cs"?"Jídlo":"Food",k:"food"},{icon:"🌳",label:L==="cs"?"Formy":"Moulds",k:"formy"},
      {icon:"🏺",label:L==="cs"?"Pánve":"Crucibles",k:"pReady"}
    ];
    const resGrid=h("div",{style:{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"2px 8px"}});
    resReport.forEach(({icon,label,k})=>{
      const cur=k==="pReady"?p.pReady:(p.res[k]||0);
      if(cur>0||k==="food"||k==="wood"){
        resGrid.append(h("div",{style:{fontSize:"10px",color:"#8b5e34"}},
          `${icon} ${label}: ${cur}`));
      }
    });
    prodBox.append(resGrid);

    // Práce dělníků v tomto kole (řádky __PROD__ z logu kola)
    const sumWorkerProd=sd.workerProd||[];
    if(sumWorkerProd.length>0){
      const wpBox=h("div",{style:{marginTop:"6px",paddingTop:"5px",borderTop:"1px solid rgba(74,122,58,.2)"}});
      wpBox.append(h("div",{style:{fontSize:"9px",fontWeight:"700",color:"#4a7a3a",marginBottom:"3px"}},
        L==="cs"?"👷 PRÁCE V TOMTO KOLE":"👷 WORK THIS ROUND"));
      sumWorkerProd.slice(0,14).forEach(t=>wpBox.append(h("div",{style:{fontSize:"10px",color:"#3a2a14",marginBottom:"2px",lineHeight:"1.4"}},t)));
      prodBox.append(wpBox);
    }

    // Hint co dělat dál — pouze pokud není vypnuté v settings
    const showHints=p.showHints!==false; // default: zapnuto
    const nextHints=[];
    if(showHints){
      if(!p.fActive&&p.round>=PREP) nextHints.push(L==="cs"?"🔥 Pec chladí — přidej palivo (Dřevo·Pec → Palivo 80%+)":"🔥 Furnace cold — add fuel");
      if((p.waldglas?.length||0)>2&&p.grose<15) nextHints.push(L==="cs"?`💰 Máš ${p.waldglas.length}× neprodané sklo → jdi na Trh a prodej`:`💰 ${p.waldglas.length}× unsold glass → go to Market`);
      if(p.pReady<1) nextHints.push(L==="cs"?"🏺 Žádné pánve — přiřaď Káninského na Pánvař":"🏺 No crucibles — assign to Crucible task");
      if((p.res.wood||0)<8) nextHints.push(L==="cs"?"🪵 Dřevo dochází — nakup u Weisse (Trh) nebo pošli Komára kácet":"🪵 Low wood — buy at market or send logger");
      if((p.res.potash||0)<3&&p.round>=4) nextHints.push(L==="cs"?"🌿 Potaš dochází — Loužírna potřebuje 6🪵 a dělníka":"🌿 Potash low — Potash station needs 6 wood");
      if(p.debt>30&&p.grose<5) nextHints.push(L==="cs"?`📜 Dluh ${p.debt}g a prázdná pokladna — prodej sklo nebo půjč od Faktora Weisse`:`📜 Debt ${p.debt}g, empty purse — sell glass or borrow from Factor Weiss`);
      if(sd.wagesDeficit>0) nextHints.push(L==="cs"?`⚠️ Nezaplaceno ${sd.wagesDeficit}g — dělníci jsou nespokojení. Splaťte z Účtů.`:`⚠️ Unpaid ${sd.wagesDeficit}g — workers unhappy. Pay from Accounts tab.`);
      // Nové hinty v8
      if(p.round>=PREP&&p.waldglas.length===0&&p.crystal.length===0) nextHints.push(L==="cs"?"🫥 Prázdná sklárna — zkontroluj pánve a palivo v tabu Pec":"🫥 Empty foundry — check crucibles and fuel in Furnace tab");
      if((p.tercik?.length||0)===0&&p.round>=PREP) nextHints.push(L==="cs"?"🪟 Terčíky = rychlé groše — jdi na Výroba → Okenní sklo":"🪟 Window discs = quick coin — go to Production → Window glass");
      if(p.morale<40) nextHints.push(L==="cs"?"😟 Nálada klesla — dej lidem pivo nebo zaplaď mzdy (Huť → Účty)":"😟 Morale low — give beer or pay wages (Foundry → Accounts)");
      if((p.res.sand||0)<3&&p.round<PREP) nextHints.push(L==="cs"?"🏖️ Dochází písek — pošli horníka nebo nakup u Weisse":"🏖️ Low sand — send miner or buy from Weiss");
    }

    if(nextHints.length>0){
      const nhBox=h("div",{style:{background:"rgba(139,94,52,.06)",borderRadius:"4px",padding:"8px 10px",marginBottom:"8px",borderLeft:"3px solid #8b5e34"}});
      const nhHdr=h("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"5px"}});
      nhHdr.append(
        h("div",{style:{fontSize:"10px",fontWeight:"700",color:"#8b5e34"}},L==="cs"?"💡 CO DÁL":"💡 NEXT STEPS"),
        h("button",{class:"btn btn-s",style:{fontSize:"8px",padding:"1px 5px",opacity:.6},
          onClick:()=>{G.showHints=false;render();}},L==="cs"?"skrýt":"hide"));
      nhBox.append(nhHdr);
      nextHints.slice(0,4).forEach(h2=>nhBox.append(h("div",{style:{fontSize:"10px",color:"#3a2a14",marginBottom:"3px",lineHeight:"1.4"}},h2)));
      body.append(nhBox);
    }else if(!showHints){
      // Skryté hinty — malý odkaz pro obnovení
      const restoreDiv=h("div",{style:{fontSize:"9px",color:"rgba(139,94,52,.5)",textAlign:"right",
        marginBottom:"4px",cursor:"pointer"},onClick:()=>{G.showHints=true;render();}},
        L==="cs"?"💡 zobrazit tipy":"💡 show tips");
      body.append(restoreDiv);
    }
    body.append(prodBox);

    // ── FINANČNÍ PŘEHLED & DLUHOVÝ ROZBOR KOLA ──
    const ecoBox=h("div",{style:{background:"rgba(0,0,0,.04)",borderRadius:"4px",padding:"8px 10px",marginBottom:"8px",borderLeft:"3px solid #c9952b"}});
    ecoBox.append(h("div",{style:{fontSize:"10px",fontWeight:"700",color:"#8b5e34",marginBottom:"5px"}},L==="cs"?"📊 ÚČETNICTVÍ & HOSPODAŘENÍ KOLA":"📊 ROUND ACCOUNTS & FINANCES"));
    const ecoRows=[
      ...(sd.contractIncome>0?[{label:L==="cs"?"✅ Příjem ze zakázek":"✅ Contract income",val:"+"+sd.contractIncome+"g",c:"#4a7a3a"}]:[]),
      {label:L==="cs"?"💸 Mzdy (náklad)":"💸 Wages (cost)",val:"-"+sd.wages+"g",c:"#a03020"},
      {label:L==="cs"?"🍺 Pivo & režie":"🍺 Beer & rations",val:"-"+sd.bCost+"g",c:"#8b5e34"},
      ...(sd.dPay>0?[{label:L==="cs"?"📜 Splátka dluhu u Weisse":"📜 Weiss debt payment",val:"-"+sd.dPay+"g",c:"#4a7a3a"}]:[]),
      {label:L==="cs"?"Δ Změna pokladny":"Δ Cash change",val:(sd.groseDelta>=0?"+":"")+sd.groseDelta+"g",c:sd.groseDelta>=0?"#4a7a3a":"#a03020",bold:true},
    ];
    ecoRows.forEach(r=>ecoBox.append(h("div",{style:{display:"flex",justifyContent:"space-between",fontSize:"11px",
      marginBottom:"3px",fontWeight:r.bold?"700":"400"}},
      h("span",{style:{color:"#8b5e34"}},r.label),
      h("span",{style:{color:r.c}},r.val))));

    // DLUH STATUS & VAROVÁNÍ
    const debtStatusCard=h("div",{style:{marginTop:"6px",padding:"6px 8px",background:"rgba(42,26,10,.05)",borderRadius:"3px",border:"1px solid rgba(42,26,10,.12)"}});
    const dHeader=h("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"center",fontSize:"11px"}});
    dHeader.append(
      h("span",{style:{fontWeight:"600",color:"#8b5e34"}},"📜 "+(L==="cs"?"Stav dluhu u Faktora Weisse:":"Debt owed to Factor Weiss:")),
      h("strong",{style:{fontSize:"12px",color:p.debt>0?"#a03020":"#4a7a3a"}},p.debt>0?(p.debt+"g"):(L==="cs"?"✅ 0g (Bez dluhu)":"✅ 0g (No debt)"))
    );
    debtStatusCard.append(dHeader);
    {
      const lb=liabilities(p);
      debtStatusCard.append(h("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"center",fontSize:"11px",marginTop:"3px"}},
        h("span",{style:{fontWeight:"600",color:"#8b5e34"}},"👥 "+(L==="cs"?"Dluh partě (nevyplacené mzdy):":"Owed to the crew (unpaid wages):")),
        h("strong",{style:{fontSize:"12px",color:lb.crew>0?"#a03020":"#4a7a3a"}},lb.crew>0?(lb.crew+"g"):"✅ 0g")));
      if(lb.claims>0)debtStatusCard.append(h("div",{style:{fontSize:"10px",color:"#8b5e34",marginTop:"1px",paddingLeft:"14px"}},
        (L==="cs"?"z toho bývalí zaměstnanci: ":"of which former employees: ")+lb.claims+"g"));
      if(lb.weiss>0&&lb.crew>0)debtStatusCard.append(h("div",{style:{display:"flex",justifyContent:"space-between",fontSize:"11px",marginTop:"3px",paddingTop:"3px",borderTop:"1px dashed rgba(42,26,10,.2)"}},
        h("span",{style:{fontWeight:"700",color:"#8b5e34"}},L==="cs"?"Závazky celkem:":"Total liabilities:"),
        h("strong",{style:{color:"#a03020"}},lb.total+"g")));
      debtStatusCard.append(h("div",{style:{fontSize:"9px",color:"#8b5e34",marginTop:"3px",fontStyle:"italic"}},
        L==="cs"?"Dvě oddělené věci: dluh u Weisse (úvěr, auto-splátka) a dluh partě (nevyplacené mzdy — platí se v záložce Parta, jinak klesá loajalita)."
                :"Two separate things: debt to Weiss (loan, auto-repayment) and debt to the crew (unpaid wages — paid in the Crew tab, otherwise loyalty drops)."));
    }
    if(p.debtMoratorium>0){
      debtStatusCard.append(h("div",{style:{fontSize:"10px",color:"#4a7a3a",marginTop:"3px",fontWeight:"600"}},
        "⏳ "+(L==="cs"?`Aktivní odklad splátek: zbývá ${p.debtMoratorium} kol bez automatických srážek.`:`Active moratorium: ${p.debtMoratorium} rounds left without auto-deductions.`)));
    }else if(p.debt>0&&sd.dPay>0){
      debtStatusCard.append(h("div",{style:{fontSize:"10px",color:"#4a7a3a",marginTop:"2px"}},
        L==="cs"?`✓ V tomto kole automaticky splaceno ${sd.dPay}g.`:`✓ Auto-repaid ${sd.dPay}g this round.`));
    }
    if(sd.wagesDeficit>0){
      debtStatusCard.append(h("div",{style:{fontSize:"10px",color:"#a03020",marginTop:"4px",fontWeight:"700",background:"rgba(160,48,32,.08)",padding:"3px 5px",borderRadius:"3px"}},
        L==="cs"?`⚠️ Huť dluží partě na mzdách ${sd.wagesDeficit}g! Roste dluh partě a klesá loajalita dělníků. Prodej sklo a vyplať mzdy (záložka Parta).`
                :`⚠️ Foundry owes the crew ${sd.wagesDeficit}g in wages! Crew debt grows and loyalty drops. Sell glass and pay the wages (Crew tab).`));
    }
    ecoBox.append(debtStatusCard);
    body.append(ecoBox);

    // ── DĚLNÍCI — mzdy a dluhy ──
    const workerBox=h("div",{style:{background:"rgba(0,0,0,.04)",borderRadius:"4px",padding:"8px 10px",marginBottom:"8px",borderLeft:"3px solid #8b5e34"}});
    workerBox.append(h("div",{style:{fontSize:"10px",fontWeight:"700",color:"#8b5e34",marginBottom:"5px"}},L==="cs"?"👷 MZDY DĚLNÍKŮ":"👷 WORKER WAGES"));
    p.workers.forEach(w=>{
      const wEntry=sd.workerWages?sd.workerWages.find(x=>x.id===w.id):null;
      const wage=wEntry?wEntry.wage:(2+(w.wageMod||0));
      const paid=wEntry?wEntry.paid:true;
      const shortfall=wEntry?wEntry.shortfall:0;
      const unpaid=w.unpaidDebt||0;
      const row=h("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"center",
        fontSize:"10px",marginBottom:"3px",padding:"2px 0",
        borderBottom:"1px solid rgba(42,26,10,.06)"}});
      row.append(
        h("span",{style:{color:"#3a2a14"}},w.name+" "+"★".repeat(Math.max(0,w.lv||0))),
        h("div",{style:{display:"flex",gap:"8px",alignItems:"center"}},
          h("span",{style:{color:paid?"#4a7a3a":"#a03020"}},paid?("✓ "+wage+"g"):("✗ "+wage+"g → "+(L==="cs"?"dluh":"debt"))),
          unpaid>0?h("span",{style:{color:"#a03020",fontWeight:"700"}},(L==="cs"?"celk. dluh":"total debt")+": "+unpaid+"g"):h("span",{},"")
        ));
      workerBox.append(row);
    });
    // Možnost splatit dluhy dělníkům
    const indebted=p.workers.filter(w=>(w.unpaidDebt||0)>0);
    if(indebted.length>0||claimsTotal(p)>0){
      const totalUnpaid=indebted.reduce((s,w)=>s+(w.unpaidDebt||0),0)+claimsTotal(p);
      const canPay=p.grose>=totalUnpaid;
      workerBox.append(h("div",{style:{marginTop:"6px"}},
        h("button",{class:"btn btn-s"+(canPay?" btn-p":""),
          style:{width:"100%",fontSize:"10px",opacity:canPay?1:0.5,cursor:canPay?"pointer":"not-allowed"},
          onClick:()=>{
            if(!canPay)return;
            payWorkerDebtsSummary();
          }},L==="cs"?"💸 Splatit dluhy dělníkům ("+totalUnpaid+"g)":"💸 Clear worker debts ("+totalUnpaid+"g)")));
    }
    body.append(workerBox);

    // ── ZAKÁZKY — stav v tomto kole ──
    if(p.contracts&&p.contracts.length>0||(sd.contractIncome&&sd.contractIncome>0)){
      const conBox=h("div",{style:{background:"rgba(42,26,10,.04)",borderRadius:"4px",padding:"8px 10px",marginBottom:"8px",borderLeft:"3px solid #c9952b"}});
      conBox.append(h("div",{style:{fontSize:"10px",fontWeight:"700",color:"#8b5e34",marginBottom:"5px"}},L==="cs"?"📜 ZAKÁZKY":"📜 CONTRACTS"));
      // Splněné toto kolo
      if(sd.contractIncome>0){
        conBox.append(h("div",{style:{fontSize:"11px",color:"#4a7a3a",marginBottom:"3px",fontWeight:"700"}},
          "✅ "+(L==="cs"?"Splněno toto kolo: +":"Fulfilled this round: +")+sd.contractIncome+"g"));
      }
      // Aktivní se stavem
      if(p.contracts&&p.contracts.length>0){
        p.contracts.forEach(c=>{
          const roundsLeft=Math.max(0,c.due-p.round);
          const urgent=contractUrgent(roundsLeft);
          const inv=c.item==="crystal"?p.crystal:c.item==="waldglas"?p.waldglas:(p[c.item]||[]);
          const have=Math.min(inv.length,c.qty);
          const buyerIcon=c.buyer==="Opat"?"⛪":c.buyer==="Slechtic"?"🏰":c.buyer==="Hoffmann"?"🏙️":"🛒";
          conBox.append(h("div",{style:{fontSize:"10px",color:urgent?"#a03020":"#5a3a1a",
            marginBottom:"2px",display:"flex",justifyContent:"space-between"}},
            h("span",null,buyerIcon+" "+(L==="cs"?c.cs:c.en).substring(0,35)+((L==="cs"?c.cs:c.en).length>35?"…":"")),
            h("span",{style:{fontWeight:"700",flexShrink:0,marginLeft:"4px"}},
              have+"/"+c.qty+" · ⏳"+roundsLeft+(L==="cs"?"m":"mo"))));
        });
      }
      // Hint jít na trh pokud jsou dostupné a volný slot
      if((p.avail||[]).length>0&&(p.contracts||[]).length<3){
        conBox.append(h("div",{style:{fontSize:"10px",color:"#8b5e34",marginTop:"4px",fontStyle:"italic"}},
          L==="cs"?"💡 Na Trhu čekají nové zakázky":"💡 New contracts waiting at Market"));
      }
      body.append(conBox);
    }

    // ── NÁLADA A MORÁLKA ──
    const morBox=h("div",{style:{background:"rgba(0,0,0,.04)",borderRadius:"4px",padding:"8px 10px",marginBottom:"12px",borderLeft:"3px solid "+(sd.mDelta>=0?"#4a7a3a":"#a03020")}});
    morBox.append(h("div",{style:{fontSize:"10px",fontWeight:"700",color:"#8b5e34",marginBottom:"4px"}},L==="cs"?"😊 NÁLADA HUTĚ":"😊 FOUNDRY MORALE"));
    morBox.append(h("div",{style:{display:"flex",justifyContent:"space-between",fontSize:"11px"}},
      h("span",{style:{color:"#8b5e34"}},L==="cs"?"Aktuální nálada:":"Current morale:"),
      h("span",{style:{color:p.morale>60?"#4a7a3a":p.morale>35?"#c9952b":"#a03020",fontWeight:"700"}},p.morale+" "+(sd.mDelta!==0?"("+(sd.mDelta>0?"+":"")+sd.mDelta+")":""))));
    body.append(morBox);

    const btn=h("button",{class:"btn btn-p",style:{width:"100%",padding:"10px",fontSize:"14px"},
      onClick:continueFromSummary},
      L==="cs"?"Další měsíc →":"Next Month →");
    app.append(hdr,body,h("div",{style:{padding:"12px 14px",flexShrink:0}},btn));
    return;
  }

  // ════════════════════════════════════════════════════════════
  // LOAJALITNÍ MODAL — dělníci s nezaplacenými dluhy
  // ════════════════════════════════════════════════════════════
  if(p._loyaltyModalPending&&p.phase==="playing"){
    const debtedWorkers=p.workers.filter(w=>(w.unpaidDebt||0)>0);
    if(debtedWorkers.length>0){
      const modal=h("div",{class:"modal-bg",style:{position:"fixed",inset:0,background:"rgba(0,0,0,.6)",
        display:"flex",alignItems:"center",justifyContent:"center",zIndex:200}});
      const box=h("div",{style:{background:"linear-gradient(145deg,#f4e4c1,#e8d5a3)",borderRadius:"6px",
        padding:"20px",maxWidth:"340px",width:"90%",boxShadow:"0 4px 24px rgba(0,0,0,.5)",
        fontFamily:"Georgia,serif",border:"2px solid #8b5e34"}});
      box.append(
        h("div",{style:{fontSize:"13px",fontWeight:"700",color:"#3a2a14",marginBottom:"8px",borderBottom:"1px solid rgba(42,26,10,.15)",paddingBottom:"6px"}},
          "⚠️ "+(L==="cs"?"Nespokojení dělníci":"Disgruntled Workers")),
        h("div",{style:{fontSize:"11px",color:"#8b5e34",marginBottom:"10px",lineHeight:"1.6"}},
          L==="cs"
            ?"Tito dělníci nedostali plnou mzdu. Uvažují o odchodu do jiné hutě."
            :"These workers did not receive full wages. They are considering leaving for another foundry."));
      debtedWorkers.forEach(w=>{
        box.append(h("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"center",
          padding:"4px 8px",marginBottom:"3px",background:"rgba(160,0,0,.07)",borderRadius:"3px",
          fontSize:"11px",border:"1px solid rgba(160,0,0,.15)"}},
          h("span",{style:{fontWeight:"700",color:"#3a2a14"}},w.name+" "+"★".repeat(Math.max(0,w.lv||0))),
          h("span",{style:{color:"#a03020"}},(L==="cs"?"dluh: ":"owes: ")+(w.unpaidDebt||0)+"g")));
      });
      const totalUnpaid=debtedWorkers.reduce((s,w)=>s+(w.unpaidDebt||0),0);
      const canPayAll=p.grose>=totalUnpaid;
      box.append(h("div",{style:{marginTop:"10px",display:"flex",flexDirection:"column",gap:"5px"}}));
      const btnRow=h("div",{style:{display:"flex",flexDirection:"column",gap:"5px",marginTop:"10px"}});
      if(canPayAll){
        btnRow.append(h("button",{class:"btn btn-p",style:{width:"100%",fontSize:"11px"},
          onClick:loyaltyModalPayAll},L==="cs"?"💸 Splatit vše ("+totalUnpaid+"g) — dělníci zůstanou":"💸 Pay all ("+totalUnpaid+"g) — workers stay"));
      }
      btnRow.append(h("button",{class:"btn",style:{width:"100%",fontSize:"11px"},
        onClick:loyaltyModalPromise},L==="cs"?"🤝 Slíbit doplatek — dělníci váhají (+5 loaj.)":"🤝 Promise payment — workers hesitate (+5 loy.)"));
      btnRow.append(h("button",{class:"btn",style:{width:"100%",fontSize:"11px",opacity:.7},
        onClick:loyaltyModalDismiss},
        L==="cs"?"Pokračovat bez slíbu":"Continue without promise"));
      box.append(btnRow);
      modal.append(box);
      app.append(modal);
      return;
    }else{
      dropStaleLoyaltyModal();
    }
  }

  // ════════════════════════════════════════════════════════════
  // KONTRAKT MODAL — nové zakázky po startu sezóny
  // ════════════════════════════════════════════════════════════
  if(p._contractModalPending&&p.phase==="playing"){
    const avail=p.avail||[];
    const top2=[...avail].sort((a,b)=>b.reward-a.reward).slice(0,2);
    const rest=avail.length-top2.length;
    const modal=h("div",{class:"modal-bg fj-d1-contract-modal",style:{position:"fixed",inset:0,background:"rgba(0,0,0,.65)",
      display:"flex",alignItems:"center",justifyContent:"center",zIndex:220}});
    const box=h("div",{class:"fj-d1-contract-dialog",style:{background:"linear-gradient(145deg,#f4e4c1,#e8d5a3)",borderRadius:"6px",
      padding:"20px",maxWidth:"360px",width:"90%",boxShadow:"0 4px 24px rgba(0,0,0,.5)",
      fontFamily:"Georgia,serif",border:"2px solid #8b5e34"}});
    // Hlavička
    box.append(
      h("div",{class:"fj-d1-modal-heading",style:{fontSize:"14px",fontWeight:"700",color:"#3a2a14",marginBottom:"4px",
        borderBottom:"1px solid rgba(42,26,10,.2)",paddingBottom:"8px"}},
        "📜 "+(L==="cs"?"Nové zakázky na trhu":"New Contracts Available")),
      h("div",{class:"fj-d1-modal-intro",style:{fontSize:"10px",color:"#8b5e34",marginBottom:"10px",fontStyle:"italic"}},
        L==="cs"
          ?"Kupci přišli s nabídkami na novou sezónu. Přijmeš?"
          :"Merchants arrived with offers for the new season. Will you accept?")
    );
    if(top2.length===0){
      box.append(h("div",{style:{fontSize:"11px",color:"#8b5e34",marginBottom:"10px"}},
        L==="cs"?"Žádné zakázky tento rok.":"No contracts this year."));
    }
    // Top 2 kontrakty
    top2.forEach(c=>{
      const canAccept=canAcceptContract()&&!(p.contracts||[]).find(x=>x.id===c.id);
      const alreadyAccepted=!!(p.contracts||[]).find(x=>x.id===c.id);
      const row=h("div",{class:"fj-d1-contract-option",style:{padding:"8px 10px",marginBottom:"6px",borderRadius:"4px",
        background:"rgba(255,255,255,.35)",border:"1px solid rgba(139,94,52,.25)"}});
      const buyerIcon=c.buyer==="Opat"?"⛪":c.buyer==="Slechtic"?"🏰":c.buyer==="Hoffmann"?"🏙️":"🛒";
      row.append(
        h("div",{style:{fontSize:"11px",fontWeight:"700",color:"#3a2a14",marginBottom:"3px"}},
          buyerIcon+" "+(L==="cs"?c.cs:c.en)),
        h("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"center",marginTop:"4px"}},
          h("span",{style:{fontSize:"10px",color:"#4a7a3a",fontWeight:"700"}},"+"+c.reward+"g"),
          alreadyAccepted
            ?h("span",{style:{fontSize:"10px",color:"#4a7a3a"}},L==="cs"?"✓ Přijato":"✓ Accepted")
            :h("button",{class:"btn btn-s"+(canAccept?" btn-p":""),
                style:{opacity:canAccept?1:0.45,cursor:canAccept?"pointer":"not-allowed",fontSize:"10px"},
                onClick:()=>{
                  if(!canAccept)return;
                  acceptContract(c.id);
                }},L==="cs"?"Přijmout":"Accept"))
      );
      box.append(row);
    });
    // Slotů info
    const usedSlots=(p.contracts||[]).length;
    if(usedSlots>=MAX_CONTRACTS){
      box.append(h("div",{style:{fontSize:"10px",color:"#a03020",marginBottom:"6px",fontStyle:"italic"}},
        L==="cs"?`⚠️ Plno zakázek (max ${MAX_CONTRACTS}). Splň aktivní před přijetím dalších.`:`⚠️ Contract slots full (max ${MAX_CONTRACTS}).`));
    }
    // Odkaz na Trh + Zavřít
    const btnRow=h("div",{class:"fj-d1-modal-actions",style:{display:"flex",gap:"6px",marginTop:"10px"}});
    if(rest>0){
      btnRow.append(h("button",{class:"btn btn-s",style:{flex:1,fontSize:"10px"},
        onClick:()=>{G._contractModalPending=false;G.tab="market";render();}},
        L==="cs"?"→ Trh ("+rest+" dalších)":"→ Market ("+rest+" more)"));
    }
    btnRow.append(h("button",{class:"btn btn-p",style:{flex:1,fontSize:"11px"},
      onClick:()=>{G._contractModalPending=false;render();}},
      L==="cs"?"Pokračovat →":"Continue →"));
    box.append(btnRow);
    modal.append(box);
    app.append(modal);
    return;
  }

  // ════════════════════════════════════════════════════════════
  // RETENTION MODAL — dělník uvažuje o odchodu
  // ════════════════════════════════════════════════════════════
  if(p._retentionPending&&p._retentionPending.length>0&&p.phase==="playing"){
    const wId=p._retentionPending[0];
    const rw=p.workers.find(x=>x.id===wId);
    if(rw){
      const modal=h("div",{class:"modal-bg",style:{position:"fixed",inset:0,background:"rgba(0,0,0,.65)",
        display:"flex",alignItems:"center",justifyContent:"center",zIndex:210}});
      const box=h("div",{class:"retention-modal-box"});
      // Portrét + jméno
      const headRow=h("div",{style:{display:"flex",gap:"12px",alignItems:"flex-start",marginBottom:"12px",
        paddingBottom:"10px",borderBottom:"1px solid rgba(42,26,10,.2)"}});
      const portBox=h("div",{style:{width:"56px",height:"56px",borderRadius:"5px",overflow:"hidden",
        background:"#1a0e06",flexShrink:0}});
      const imgEl=document.createElement("img");
      if(window.FajrumPortraits)FajrumPortraits.configure(imgEl,rw);else imgEl.src=`img/workers/${rw.portrait||"unknown"}.jpg`;
      imgEl.style.cssText="width:100%;height:100%;object-fit:cover;object-position:top center;";
      imgEl.onerror=function(){this.style.display="none";};
      portBox.appendChild(imgEl);
      headRow.append(portBox);
      const headInfo=h("div",{style:{flex:1}});
      const tier=workerTier(rw.lv);
      headInfo.append(
        h("div",{style:{fontWeight:"700",fontSize:"13px",color:"#3a2010",marginBottom:"2px"}},
          "👋 "+rw.name),
        h("div",{style:{fontSize:"10px",color:"#8b5e34",marginBottom:"4px"}},
          `${tier.cs} · ${tier.de} lv.${rw.lv} · ${(L==="cs"?"Loaj.":"Loy.")}: ${rw.loyalty}%`),
        h("div",{style:{fontSize:"10px",color:"#5a3a1a",fontStyle:"italic",lineHeight:"1.5"}},
          `"${rw[L==="cs"?"quote_cs":"quote_en"]||"..."}"`)
      );
      headRow.append(headInfo); // E1c: originally omitted; show the existing name, rank and quote beside the portrait.
      box.append(headRow);
      // Situace
      const unpaid=rw.unpaidDebt||0;
      const sitText=rw.loyalty<20
        ?(L==="cs"?"Tenhle člověk má sbalené věci. Teď nebo nikdy.":"This man has his bags packed. Now or never.")
        :(L==="cs"?"Přemýšlí o odchodu do jiné hutě. Slyšel o místě ve Falknově.":"He's thinking about leaving for another foundry. Heard of a spot in Falknov.");
      box.append(h("div",{style:{fontSize:"11px",color:"#5a2a10",marginBottom:"10px",lineHeight:"1.6",
        padding:"8px",background:"rgba(160,48,32,.07)",borderRadius:"4px",border:"1px solid rgba(160,48,32,.15)"}},
        "⚠️ "+sitText));
      if(unpaid>0){
        box.append(h("div",{style:{fontSize:"11px",color:"#a03020",marginBottom:"8px",fontWeight:"600"}},
          `💸 ${L==="cs"?"Dlužné mzdy":"Owed wages"}: ${unpaid}g — ${L==="cs"?"to ho drásá nejvíc":"this hurts him most"}`));
      }
      // Kontrakt volby
      box.append(h("div",{style:{fontSize:"10px",fontWeight:"700",color:"#8b5e34",marginBottom:"5px"}},
        L==="cs"?"📜 Nabídni kontrakt (záloha):":"📜 Offer contract (advance payment):"));
      const contractGrid=h("div",{style:{marginBottom:"10px"}});
      let selectedMonths=null;
      CONTRACT_OPTIONS.forEach(opt=>{
        const cost=contractCost(rw,opt.months);

  }else if(p.tab==="log"){

  // ── TAB: ÚČTY ──

    const activeAll=(p.contracts||[]).map(c=>({c:c,kind:"market"}))

        L==="cs"?"Žádné aktivní zakázky. Nabídky najdeš níže a na Trhu — plněním buduješ reputaci.":"No active contracts. Offers are listed below and at the Market — fulfilling them builds reputation."));

    const beerCostNext=([0,1,2,4][p.beer]||0)*Math.ceil(p.workers.length/3);

    const debtAutoNext=p.debt>0&&p.grose>5?Math.min(5,p.grose-2,p.debt):0;

  // ── TAB: PARTA ──

        const fat=Math.round(Math.max(0,Math.min(1,Number(w.fat)||0))*100);
        const health=w.health??100;
        const loyalty=w.loyalty??70;
        const npc=NPC_ROSTER.find(n=>n.id===w.npcId||n.id===w.id)||{};

        bigImg.alt=w.name;
        bigImg.onerror=function(){
          this.style.display="none";
          const svg=NPC_SVG[w.portrait];
          if(svg){portBig.innerHTML=svg;}
